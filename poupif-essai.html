<script>
/* Scène source : essai-carte.excalidraw, copie du plan existant avec la vraie image de la caravane.
   Le SVG garde les coordonnées de son export (décalage -160, -70). HTML déplace la caméra et pose
   un repère dessiné PAR-DESSUS l'image : le décor reste caché derrière le dessin sur la carte,
   puis se révèle dans la continuité du mouvement, comme si l'on passait dedans.
   Aucun SDK de conversation, appel réseau vocal, micro ou génération. */
(function(){
'use strict';
const theatre=document.getElementById('theatre'),monde=document.getElementById('monde'),cache=document.getElementById('cache');
const entrer=document.getElementById('entrer'),retour=document.getElementById('retour'),porte=document.getElementById('porte');
const etat=document.getElementById('etat'),repere=document.getElementById('repere');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Coordonnées du monde (SVG - 160, -70) : image de la caravane et porte du dessin. */
const PLAN_W=4328,PLAN_H=1772,PH={x:3064,y:354,w:1200,h:750},PORTE={x:3064+880,y:354+470};
function cadres(){
 const w=theatre.clientWidth,h=theatre.clientHeight;
 const zc=Math.min((w-28)/PLAN_W,(h-30)/PLAN_H);
 const zp=Math.max(w/380,h/520);                 /* plongée forte sur la porte du dessin */
 const zd=Math.max(w/PH.w,h/PH.h);               /* le décor remplit toute la scène */
 return {
  carte:{z:zc,cx:PLAN_W/2,cy:PLAN_H/2},
  porte:{z:zp,cx:PORTE.x,cy:PORTE.y},
  decor:{z:zd,cx:PH.x+PH.w/2,cy:PH.y+PH.h/2}};
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function interp(a,b,s){return{z:Math.exp(Math.log(a.z)+(Math.log(b.z)-Math.log(a.z))*s),cx:a.cx+(b.cx-a.cx)*s,cy:a.cy+(b.cy-a.cy)*s};}
/* Trajet : carte entière -> plongée sur la porte -> le décor s'ouvre autour.
   Le point regardé reste au centre de l'écran pendant tout le vol. */
function cadreAt(p){
 const c=p<0.55?interp(cadres().carte,cadres().porte,ease(p/0.55)):interp(cadres().porte,cadres().decor,ease((p-0.55)/0.45));
 const w=theatre.clientWidth,h=theatre.clientHeight;
 return {z:c.z,x:w/2-c.cx*c.z,y:h/2-c.cy*c.z};
}
/* Le dessin ne s'efface qu'une fois la caméra engagée : le décor apparaît derrière, en mouvement. */
function opCache(p){return p<=0.48?1:p>=0.74?0:1-(p-0.48)/0.26;}
function rendre(p){const c=cadreAt(p);monde.style.transform=`translate(${c.x}px,${c.y}px) scale(${c.z})`;cache.style.opacity=opCache(p);}
let scene='carte',pActu=0,animId=0,fin=0,debut=0;
function finAnim(){entrer.disabled=scene==='caravane';retour.disabled=scene==='carte';porte.tabIndex=scene==='carte'?0:-1;
 etat.textContent=scene==='carte'?'Tout est sur la carte. Entrons dans la caravane, à droite.':'Nous y sommes : le décor se cachait derrière le dessin.';}
function aller(nom){
 if(nom===scene)return;
 const depart=pActu,arrivee=nom==='caravane'?1:0;
 scene=nom;document.body.dataset.scene=nom;
 entrer.disabled=true;retour.disabled=true;porte.tabIndex=-1;
 repere.textContent=nom==='carte'?'01 / La carte':'02 / Dans le décor';
 if(reduced){pActu=arrivee;rendre(pActu);finAnim();fin=performance.now();return;}
 const t0=performance.now(),D=3400;debut=t0;fin=t0+D;
 cancelAnimationFrame(animId);
 (function boucle(t){
  const u=Math.min(1,(t-t0)/D);
  pActu=depart+(arrivee-depart)*u;rendre(pActu);
  if(u<1)animId=requestAnimationFrame(boucle);else finAnim();
 })(t0);
}
entrer.addEventListener('click',()=>aller('caravane'));
porte.addEventListener('click',()=>aller('caravane'));
retour.addEventListener('click',()=>aller('carte'));
addEventListener('keydown',e=>{if(e.key==='Escape'&&scene!=='carte'){aller('carte');entrer.focus();}});
new ResizeObserver(()=>rendre(pActu)).observe(theatre);rendre(0);
document.getElementById('plan').addEventListener('error',()=>document.getElementById('erreur').hidden=false);
const canvas=document.getElementById('poupif'),ctx=canvas.getContext('2d'),marche=new Image(),salut=new Image();
marche.src='images/poupif-visite/poupif-marche.webp';salut.src='images/poupif-visite/poupif-salut-face.webp';
debut=performance.now();fin=performance.now();let dernier=-1,dernierePlanche='';
function dessin(t){
 const bouge=t<fin&&!reduced;const img=bouge?marche:salut;
 let n=bouge?Math.floor((t-debut)/1000*24)%24:(reduced?0:Math.min(95,Math.floor(Math.max(0,t-fin)/1000*12)));
 const cols=bouge?6:10,ident=bouge?'marche':'salut';
 if(img.complete&&img.naturalWidth&&(n!==dernier||ident!==dernierePlanche)){
  ctx.clearRect(0,0,240,431);ctx.save();if(bouge){ctx.translate(240,0);ctx.scale(-1,1);}ctx.drawImage(img,(n%cols)*240,Math.floor(n/cols)*431,240,431,0,0,240,431);ctx.restore();dernier=n;dernierePlanche=ident;
 }
 requestAnimationFrame(dessin);
}
requestAnimationFrame(dessin);
/* Aide de contrôle visuel : ?t=0.6 fige la caméra en plein mouvement. */
const dbg=parseFloat(new URLSearchParams(location.search).get('t'));
if(!isNaN(dbg)){
 pActu=Math.min(1,Math.max(0,dbg));scene=pActu>=1?'caravane':pActu<=0?'carte':'vol';
 document.body.dataset.scene=scene==='carte'?'carte':'caravane';rendre(pActu);
 if(pActu>0&&pActu<1){debut=performance.now();fin=Infinity;}
 entrer.disabled=scene!=='carte';retour.disabled=scene==='carte';
 repere.textContent=scene==='carte'?'01 / La carte':'02 / Dans le décor';
 etat.textContent=scene==='carte'?'Tout est sur la carte. Entrons dans la caravane, à droite.':'Nous y sommes : le décor se cachait derrière le dessin.';
}
})();
</script>
</body></html>
