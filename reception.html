<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récré Magic</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --vert-caravane: #7CB69F;
            --rose-spectacle: #EC407A;
            --jaune-accent: #FFB300;
            --text-dark: #2C1810;
            --text-light: #ffffff;
            --fond-overlay: rgba(0, 0, 0, 0.55);
            --fond-carte: rgba(245, 235, 215, 0.96);
            --fond-tableau: rgba(255, 250, 235, 0.9);
            --bordure-tableau: #7a5c3e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-image: url('images/fond-image.webp');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--fond-overlay);
            z-index: 0;
            pointer-events: none;
        }

        .app-wrapper {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            width: 90%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .carte-magique {
            background: var(--fond-carte);
            backdrop-filter: blur(6px);
            border-radius: 60px;
            padding: 4rem 2rem;
            border: 5px solid #7a5c3e;
            outline: 4px solid #5a3e2a;
            outline-offset: 4px;
            box-shadow: 0 0 0 8px #3e2a1a, 0 25px 50px -12px rgba(0,0,0,0.3);
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .message-accueil {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.5rem;
            color: #2C1810;
            margin-bottom: 1rem;
        }

        .sous-message {
            font-size: 1.2rem;
            color: #5a3e2a;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .carte-magique { padding: 2rem 1.5rem; border-radius: 40px; min-height: 300px; }
            .message-accueil { font-size: 1.8rem; }
            .sous-message { font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .carte-magique { padding: 1.5rem 1rem; border-radius: 30px; min-height: 250px; }
            .message-accueil { font-size: 1.4rem; }
            .sous-message { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="carte-magique">
        <div>
            <div class="message-accueil">🎪 Merci !</div>
            <div class="sous-message">Votre devis a bien été envoyé.</div>
        </div>
    </div>
</div>

</body>
</html>
