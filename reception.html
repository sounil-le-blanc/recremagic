<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Récré Magic</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --vert-caravane: #7CB69F;
            --rose-spectacle: #EC407A;
            --jaune-accent: #FFB300;
            --text-dark: #2C1810;
            --fond-overlay: rgba(0, 0, 0, 0.55);
            --fond-carte: rgba(245, 235, 215, 0.96);
            --fond-tableau: rgba(255, 250, 235, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-image: url('images/fond-image.webp');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--fond-overlay);
            z-index: 0;
            pointer-events: none;
        }

        .app-wrapper {
            position: relative;
            z-index: 10;
            max-width: 900px;
            width: 95%;
            margin: 0 auto;
        }

        .carte-magique {
            background: var(--fond-carte);
            backdrop-filter: blur(6px);
            border-radius: 60px;
            padding: 2rem;
            border: 5px solid #7a5c3e;
            outline: 4px solid #5a3e2a;
            outline-offset: 4px;
            box-shadow: 0 0 0 8px #3e2a1a, 0 25px 50px -12px rgba(0,0,0,0.3);
        }

        h1 {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.5rem;
            color: #2C1810;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .sous-message {
            text-align: center;
            font-size: 1rem;
            color: #5a3e2a;
            margin-bottom: 2rem;
        }

        /* --- Section séparée --- */
        .section-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 1.8rem;
            color: #2C1810;
            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid var(--vert-caravane);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title .badge {
            font-size: 0.8rem;
            background: var(--vert-caravane);
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-family: 'Quicksand', sans-serif;
        }

        /* --- Vue liste --- */
        #vue-liste .devis-item,
        #vue-liste .contrat-item {
            background: var(--fond-tableau);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            margin-bottom: 0.8rem;
            border: 2px solid #c4a882;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #vue-liste .devis-item:hover,
        #vue-liste .contrat-item:hover {
            transform: translateX(8px);
            border-color: var(--vert-caravane);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #vue-liste .devis-item .nom,
        #vue-liste .contrat-item .nom {
            font-weight: 700;
            color: #2C1810;
            font-size: 1.1rem;
        }

        #vue-liste .devis-item .lieu,
        #vue-liste .contrat-item .lieu {
            color: #5a3e2a;
            font-size: 0.95rem;
        }

        #vue-liste .devis-item .date,
        #vue-liste .contrat-item .date {
            color: #888;
            font-size: 0.8rem;
        }

        #vue-liste .devis-item .arrow,
        #vue-liste .contrat-item .arrow {
            color: var(--vert-caravane);
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        #vue-liste .devis-item:hover .arrow,
        #vue-liste .contrat-item:hover .arrow {
            transform: translateX(5px);
        }

        .badge-type {
            font-size: 0.6rem;
            background: #1e0e49;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            margin-left: 0.5rem;
        }

        .badge-type.roulotte {
            background: #2c6e2c;
        }

        .aucun-item {
            text-align: center;
            color: #b0a088;
            font-style: italic;
            padding: 2rem;
            font-size: 1.1rem;
        }

        /* --- Vue détail --- */
        #vue-detail {
            display: none;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--fond-tableau);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #c4a882;
        }

        .detail-table tr {
            border-bottom: 1px solid #c4a882;
        }

        .detail-table tr:last-child {
            border-bottom: none;
        }

        .detail-table td {
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            color: #2C1810;
        }

        .detail-table .label {
            font-weight: 700;
            color: #5a3e2a;
            width: 40%;
            background: rgba(255,255,255,0.3);
        }

        .detail-table .value {
            width: 60%;
        }

        .btn-retour-liste {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.6rem 1.5rem;
            background: #5a3e2a;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
        }

        .btn-retour-liste:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-back, .btn-print, .btn-email, .btn-contrat, .btn-supprimer {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-weight: bold;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            text-decoration: none;
        }

        .btn-back {
            background: linear-gradient(135deg, #7CB69F, #5a8f78);
            color: white;
        }

        .btn-print {
            background: #1e0e49;
            color: white;
        }

        .btn-email {
            background: #D32F2F;
            color: white;
        }

        .btn-contrat {
            background: #1e0e49;
            color: white;
        }

        .btn-supprimer {
            background: #D32F2F;
            color: white;
        }

        .btn-back:hover, .btn-print:hover, .btn-email:hover, .btn-contrat:hover, .btn-supprimer:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .actions-detail {
            text-align: center;
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-supprimer-tout {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.8rem 2rem;
            background: #D32F2F;
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
        }

        .btn-supprimer-tout:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .actions-liste {
            text-align: center;
            margin-top: 1.5rem;
        }

        .badge-nouveau {
            background: #D32F2F;
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-left: 0.5rem;
        }

        /* --- Contrats section --- */
        .contrat-section {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 3px dashed var(--vert-caravane);
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .carte-magique { padding: 1.5rem; border-radius: 40px; }
            h1 { font-size: 1.8rem; }
            #vue-liste .devis-item, #vue-liste .contrat-item { padding: 0.8rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
            #vue-liste .devis-item .nom, #vue-liste .contrat-item .nom { font-size: 1rem; }
            #vue-liste .devis-item .lieu, #vue-liste .contrat-item .lieu { font-size: 0.85rem; }
            .detail-table td { padding: 0.6rem 0.8rem; font-size: 0.85rem; }
            .detail-table .label { width: 35%; }
            .actions-detail { flex-direction: column; }
            .btn-back, .btn-print, .btn-email, .btn-contrat, .btn-supprimer { display: block; width: 100%; text-align: center; }
            .section-title { font-size: 1.4rem; }
        }

        @media (max-width: 480px) {
            .carte-magique { padding: 1rem; border-radius: 30px; }
            h1 { font-size: 1.4rem; }
            #vue-liste .devis-item, #vue-liste .contrat-item { flex-direction: column; align-items: flex-start; }
            .detail-table td { padding: 0.5rem 0.6rem; font-size: 0.75rem; }
            .detail-table .label { width: 40%; }
            .section-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="carte-magique">

        <!-- ========== TITRE ========== -->
        <h1 id="titrePrincipal">📋 Tableau de bord</h1>
        <p class="sous-message" id="sousMessage">Cliquez sur un élément pour voir tous les détails</p>

        <!-- ========== VUE LISTE ========== -->
        <div id="vue-liste">
            <!-- SECTION DEVIS -->
            <div class="section-title">
                📋 DEVIS
                <span class="badge" id="devisCount">0</span>
            </div>
            <div id="listeDevis"></div>

            <!-- SECTION CONTRATS -->
            <div class="section-title contrat-section">
                📄 CONTRATS
                <span class="badge" id="contratCount">0</span>
            </div>
            <div id="listeContrats"></div>

            <div class="actions-liste">
                <a href="index.html" class="btn-back">← Retour à l'accueil</a>
                <button class="btn-supprimer-tout" onclick="supprimerTout()">🗑️ Supprimer tout</button>
            </div>
        </div>

        <!-- ========== VUE DÉTAIL ========== -->
        <div id="vue-detail">
            <button class="btn-retour-liste" onclick="afficherListe()">← Retour à la liste</button>
            <h2 id="detailTitre" style="font-family:'MedievalSharp',cursive; font-size:1.8rem; color:#2C1810; margin-bottom:1rem;">📄 Détail</h2>
            <table class="detail-table" id="detailTable">
                <tr><td class="label">👤 Nom</td><td class="value" id="d_nom">—</td></tr>
                <tr><td class="label">📧 Email</td><td class="value" id="d_email">—</td></tr>
                <tr><td class="label">📞 Téléphone</td><td class="value" id="d_telephone">—</td></tr>
                <tr><td class="label">📍 Lieu</td><td class="value" id="d_lieu">—</td></tr>
                <tr><td class="label">🎭 Spectacle</td><td class="value" id="d_spectacle">—</td></tr>
                <tr><td class="label">📅 Date</td><td class="value" id="d_date">—</td></tr>
                <tr><td class="label">🎉 Événement</td><td class="value" id="d_evenement">—</td></tr>
                <tr><td class="label">📋 Type contrat</td><td class="value" id="d_typeContrat">—</td></tr>
                <tr><td class="label">💰 Montant HT</td><td class="value" id="d_montantHT">—</td></tr>
                <tr><td class="label">💶 Total TTC</td><td class="value" id="d_totalTTC">—</td></tr>
                <tr><td class="label">💬 Message</td><td class="value" id="d_message">—</td></tr>
            </table>
            <div class="actions-detail">
                <button class="btn-print" onclick="imprimerDetail()">🖨️ Télécharger PDF</button>
                <button class="btn-back" onclick="supprimerDetail()">🗑️ Supprimer</button>
            </div>
        </div>

    </div>
</div>

<script>
    // ========== GESTION DES DEVIS ET CONTRATS ==========
    let devisListe = [];
    let contratsListe = [];
    let itemIndexActuel = -1;
    let itemTypeActuel = ''; // 'devis' ou 'contrat'

    function chargerTout() {
        // Charger les devis
        var dataDevis = localStorage.getItem('tousLesDevis');
        if (dataDevis) {
            try { devisListe = JSON.parse(dataDevis); } catch(e) { devisListe = []; }
        } else {
            var ancienData = localStorage.getItem('devisData');
            if (ancienData) {
                try {
                    var ancienDevis = JSON.parse(ancienData);
                    if (ancienDevis && ancienDevis.nom) {
                        ancienDevis.id = Date.now();
                        ancienDevis.dateCreation = new Date().toLocaleString('fr-FR');
                        devisListe = [ancienDevis];
                        sauvegarderDevis();
                    }
                } catch(e) {}
            }
        }

        // Charger les contrats
        var dataContrats = localStorage.getItem('tousLesContrats');
        if (dataContrats) {
            try { contratsListe = JSON.parse(dataContrats); } catch(e) { contratsListe = []; }
        }

        afficherListe();
    }

    function sauvegarderDevis() {
        localStorage.setItem('tousLesDevis', JSON.stringify(devisListe));
    }

    function sauvegarderContrats() {
        localStorage.setItem('tousLesContrats', JSON.stringify(contratsListe));
    }

    function ajouterDevis(donnees) {
        var nouveauDevis = {
            id: Date.now(),
            dateCreation: new Date().toLocaleString('fr-FR'),
            nom: donnees.nom || '',
            structure: donnees.structure || '',
            email: donnees.email || '',
            telephone: donnees.telephone || '',
            lieu: donnees.lieu || '',
            typeEvenement: donnees.typeEvenement || '',
            spectacles: donnees.spectacles || '',
            formuleDucoup: donnees.formuleDucoup || '',
            dateSpectacle: donnees.dateSpectacle || '',
            lieuSpectacle: donnees.lieuSpectacle || '',
            dateMaboul: donnees.dateMaboul || '',
            lieuMaboul: donnees.lieuMaboul || '',
            expositions: donnees.expositions || '',
            dateExpo: donnees.dateExpo || '',
            lieuExpo: donnees.lieuExpo || '',
            message: donnees.message || ''
        };
        devisListe.unshift(nouveauDevis);
        sauvegarderDevis();
        afficherListe();
        return nouveauDevis;
    }

    function ajouterContrat(donnees) {
        var nouveauContrat = {
            id: Date.now(),
            dateCreation: new Date().toLocaleString('fr-FR'),
            nom: donnees.nom || 'Nom inconnu',
            type: donnees.type || 'SANS ROULOTTE',
            donnees: donnees
        };
        contratsListe.unshift(nouveauContrat);
        sauvegarderContrats();
        afficherListe();
        return nouveauContrat;
    }

    function afficherListe() {
        document.getElementById('vue-liste').style.display = 'block';
        document.getElementById('vue-detail').style.display = 'none';
        document.getElementById('titrePrincipal').textContent = '📋 Tableau de bord';
        document.getElementById('sousMessage').textContent = 'Cliquez sur un élément pour voir tous les détails';

        // Mettre à jour les compteurs
        document.getElementById('devisCount').textContent = devisListe.length;
        document.getElementById('contratCount').textContent = contratsListe.length;

        // Afficher les devis
        var containerDevis = document.getElementById('listeDevis');
        if (devisListe.length === 0) {
            containerDevis.innerHTML = '<div class="aucun-item">Aucun devis pour le moment.</div>';
        } else {
            var html = '';
            devisListe.forEach(function(item, index) {
                var nom = item.nom || 'Nom inconnu';
                var lieu = item.lieu || 'Lieu non précisé';
                var date = item.dateCreation || 'Date inconnue';
                var isNew = (Date.now() - item.id) < 60000;

                html += `
                    <div class="devis-item" onclick="ouvrirDetail('devis', ${index})">
                        <div>
                            <span class="nom">${nom}</span>
                            ${isNew ? '<span class="badge-nouveau">Nouveau</span>' : ''}
                        </div>
                        <div>
                            <span class="lieu">📍 ${lieu}</span>
                            <span class="date">📅 ${date}</span>
                            <span class="arrow">→</span>
                        </div>
                    </div>
                `;
            });
            containerDevis.innerHTML = html;
        }

        // Afficher les contrats
        var containerContrats = document.getElementById('listeContrats');
        if (contratsListe.length === 0) {
            containerContrats.innerHTML = '<div class="aucun-item">Aucun contrat pour le moment.</div>';
        } else {
            var html = '';
            contratsListe.forEach(function(item, index) {
                var nom = item.nom || 'Nom inconnu';
                var type = item.type || 'SANS ROULOTTE';
                var date = item.dateCreation || 'Date inconnue';
                var isNew = (Date.now() - item.id) < 60000;
                var typeClass = type.includes('ROULOTTE') ? 'roulotte' : '';

                html += `
                    <div class="contrat-item" onclick="ouvrirDetail('contrat', ${index})">
                        <div>
                            <span class="nom">${nom}</span>
                            <span class="badge-type ${typeClass}">${type}</span>
                            ${isNew ? '<span class="badge-nouveau">Nouveau</span>' : ''}
                        </div>
                        <div>
                            <span class="date">📅 ${date}</span>
                            <span class="arrow">→</span>
                        </div>
                    </div>
                `;
            });
            containerContrats.innerHTML = html;
        }
    }

    function ouvrirDetail(type, index) {
        itemTypeActuel = type;
        itemIndexActuel = index;
        var item = type === 'devis' ? devisListe[index] : contratsListe[index];
        if (!item) return;

        document.getElementById('vue-liste').style.display = 'none';
        document.getElementById('vue-detail').style.display = 'block';
        document.getElementById('titrePrincipal').textContent = '📄 Détail';
        document.getElementById('sousMessage').textContent = type === 'devis' ? 'Devis' : 'Contrat';
        document.getElementById('detailTitre').textContent = type === 'devis' ? '📋 Détail du devis' : '📄 Détail du contrat';

        var d = item.donnees || item;
        document.getElementById('d_nom').textContent = d.nom || d.organisateur?.nom || '—';
        document.getElementById('d_email').textContent = d.email || d.organisateur?.email || '—';
        document.getElementById('d_telephone').textContent = d.telephone || d.organisateur?.telephone || '—';
        document.getElementById('d_lieu').textContent = d.lieu || d.organisateur?.adresse || '—';
        document.getElementById('d_spectacle').textContent = d.spectacles || d.spectacle || d.titre || '—';
        document.getElementById('d_date').textContent = d.dateSpectacle || d.date || '—';
        document.getElementById('d_evenement').textContent = d.typeEvenement || d.organisateur?.qualite || '—';
        document.getElementById('d_typeContrat').textContent = type === 'contrat' ? (item.type || '—') : '—';
        document.getElementById('d_montantHT').textContent = d.montantHT ? d.montantHT + ' €' : '—';
        document.getElementById('d_totalTTC').textContent = d.totalTTC ? d.totalTTC + ' €' : '—';
        document.getElementById('d_message').textContent = d.message || '—';
    }

    function supprimerDetail() {
        if (itemIndexActuel === -1) return;
        if (!confirm('Supprimer cet élément ?')) return;
        
        if (itemTypeActuel === 'devis') {
            devisListe.splice(itemIndexActuel, 1);
            sauvegarderDevis();
        } else {
            contratsListe.splice(itemIndexActuel, 1);
            sauvegarderContrats();
        }
        
        itemIndexActuel = -1;
        afficherListe();
    }

    function supprimerTout() {
        if (devisListe.length === 0 && contratsListe.length === 0) return;
        if (!confirm('Supprimer TOUS les devis et contrats ? Cette action est irréversible.')) return;
        devisListe = [];
        contratsListe = [];
        sauvegarderDevis();
        sauvegarderContrats();
        afficherListe();
    }

    function imprimerDetail() {
        window.print();
    }

    // ========== EXPOSER POUR LES AUTRES PAGES ==========
    window.ajouterContrat = ajouterContrat;

    // ========== INITIALISATION ==========
    window.onload = function() {
        chargerTout();

        // Vérifier si un devis vient d'être envoyé
        var nouveauDevis = localStorage.getItem('nouveauDevis');
        if (nouveauDevis) {
            try {
                var donnees = JSON.parse(nouveauDevis);
                ajouterDevis(donnees);
                localStorage.removeItem('nouveauDevis');
            } catch(e) {}
        }
    };
</script>
</body>
</html>
