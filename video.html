<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidéos - Récré Magic</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Récré Magic">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --vert-caravane: #7CB69F;
            --rose-spectacle: #EC407A;
            --jaune-accent: #FFB300;
            --text-dark: #2C1810;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @media (min-width: 1024px) {
            body { zoom: 150%; }
            body::before { zoom: 0.6667; }
        }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--rose-spectacle), var(--vert-caravane)); border-radius: 10px; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-image: url('images/fond-image.webp');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            padding-top: 100px;
            padding-bottom: 2rem;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
            pointer-events: none;
        }

        .navbar {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px); z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); height: 55px;
        }
        .navbar-container {
            width: 100%; height: 100%; padding: 0 1.2rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-left-group { display: flex; align-items: center; gap: 0.6rem; }
        .logo-wrapper { text-decoration: none; }
        .logo-wrapper img { height: 120px; margin-top: 60px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8)); }
        .back-arrow {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 1.1rem; text-decoration: none; cursor: pointer;
        }

        /* ========== AVATAR & MENU UTILISATEUR ========== */
        .user-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #7CB69F, #5a8f78);
            border-radius: 50%;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            transition: all 0.2s;
            border: 2px solid rgba(255,255,255,0.5);
            cursor: pointer;
        }
        .user-avatar.premium {
            background: linear-gradient(135deg, #FFB300, #e6a200);
            border: 2px solid #FFD700;
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        .user-avatar:hover {
            transform: scale(1.05);
        }
        .user-menu {
            position: relative;
            display: inline-block;
        }
        .user-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 0.5rem 0;
            min-width: 180px;
            z-index: 1001;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .user-dropdown a, .user-dropdown button {
            display: block;
            width: 100%;
            padding: 0.6rem 1rem;
            color: white !important;
            text-decoration: none !important;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Quicksand', sans-serif;
        }
        .user-dropdown a:hover, .user-dropdown button:hover {
            background: rgba(255,255,255,0.1);
            color: white !important;
            text-decoration: none !important;
        }
        .user-menu:hover .user-dropdown {
            display: block;
        }

        .nav-icons { display: flex; gap: 1.2rem; align-items: center; }
        .icon-wrapper { display: flex; flex-direction: column; align-items: center; text-decoration: none; }
        .nav-icon-img { height: 32px; }
        .icon-label { font-size: 0.6rem; color: rgba(255,255,255,0.7); }

        .main-content {
            position: relative; z-index: 10;
            max-width: 900px; width: 100%; margin: 0 auto; padding: 1rem;
        }

        .video-box {
            background: rgba(235, 215, 185, 0.96);
            border-radius: 48px; padding: 2rem; text-align: center;
            border: 5px solid #7a5c3e; outline: 4px solid #5a3e2a;
            outline-offset: 4px; box-shadow: 0 0 0 8px #3e2a1a, 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .video-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.2rem; color: var(--text-dark); margin-bottom: 1rem;
        }

        .video-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0;
            overflow: hidden; border-radius: 24px; border: 3px solid #7a5c3e;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; border-radius: 21px;
            border: none;
        }

        .video-list {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem; margin-top: 1.5rem;
        }

        .video-thumb {
            background: rgba(235, 215, 185, 0.8);
            border-radius: 24px; padding: 1rem; cursor: pointer;
            border: 3px solid #7a5c3e; text-align: center;
            font-weight: 600; color: var(--text-dark);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .video-thumb:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: var(--jaune-accent); }
        .video-thumb.active { border-color: var(--rose-spectacle); background: rgba(255,255,255,0.9); }

        .locked-box {
            background: rgba(235, 215, 185, 0.96);
            border-radius: 48px; padding: 3rem 2rem; text-align: center;
            border: 5px solid #7a5c3e; outline: 4px solid #5a3e2a;
            outline-offset: 4px; box-shadow: 0 0 0 8px #3e2a1a, 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }

        .locked-box h2 { font-family: 'MedievalSharp', cursive; font-size: 2rem; color: var(--text-dark); margin-bottom: 1rem; }
        .locked-box p { color: var(--text-dark); margin-bottom: 1.5rem; }

        .btn {
            display: inline-block; padding: 0.8rem 1.8rem; border-radius: 50px;
            text-decoration: none; font-weight: bold; font-size: 1rem;
            background: linear-gradient(135deg, var(--jaune-accent), #e6a200);
            color: var(--text-dark); transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-3px); }

        /* ========== CORRECTIONS MOBILE ========== */
        @media (max-width: 600px) {
            body { padding-top: 80px; }
            .navbar { height: 48px; }
            .navbar-container { padding: 0 0.8rem; }
            .nav-left-group { gap: 0.4rem; }
            .logo-wrapper img { height: 70px !important; margin-top: 35px; }
            .back-arrow { width: 32px; height: 32px; font-size: 1rem; }
            
            .nav-icon-img { height: 28px !important; }
            .icon-label { font-size: 0.55rem !important; letter-spacing: 0.3px; }
            .nav-icons { gap: 0.8rem; }
            
            .user-avatar { width: 36px; height: 36px; font-size: 0.9rem; }
            .user-dropdown { top: 40px; min-width: 160px; }
            .user-dropdown a, .user-dropdown button { padding: 0.5rem 0.8rem; font-size: 0.8rem; }
            
            .video-title { font-size: 1.5rem; }
            .video-box { padding: 1.5rem 1rem; border-radius: 36px; }
        }

        @media (max-width: 450px) {
            .icon-label { font-size: 0.5rem !important; }
            .nav-icon-img { height: 26px !important; }
            .nav-icons { gap: 0.6rem; }
            .navbar-container { padding: 0 0.5rem; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <div class="nav-left-group">
            <a href="index.html" class="logo-wrapper">
                <img src="images/logo.webp" alt="Récré Magic">
            </a>
            <div class="back-arrow" onclick="history.back()" title="Retour">←</div>
        </div>
        <div class="nav-icons">
            <a href="calendrier.html" class="icon-wrapper">
                <img src="images/icone-calendrier.webp" alt="Calendrier" class="nav-icon-img">
                <span class="icon-label">Calendrier</span>
            </a>
            <a href="boutique.html" class="icon-wrapper">
                <img src="images/icone-boutique.webp" alt="Boutique" class="nav-icon-img">
                <span class="icon-label">Boutique</span>
            </a>
            <!-- Lien Abonnement -->
            <a href="Abonnement.html" class="icon-wrapper" id="abonnement-link">
                <img src="images/icone-abonnement.webp" alt="Abonnement" class="nav-icon-img">
                <span class="icon-label">Abonnement</span>
            </a>
            <!-- Bouton Connexion (visible quand non connecté) -->
            <a href="connexion.html" class="icon-wrapper" id="connexion-btn">
                <img src="images/icone-connexion.webp" alt="Connexion" class="nav-icon-img">
                <span class="icon-label">Connexion</span>
            </a>
            <!-- Avatar utilisateur (caché par défaut) -->
            <div class="user-menu" id="user-menu" style="display: none;">
                <div class="user-avatar" id="user-avatar">?</div>
                <div class="user-dropdown">
                    <a href="profil.html">👤 Mon profil</a>
                    <button id="logout-btn-nav">🚪 Déconnexion</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="main-content" id="main-content">
    <div class="locked-box" style="text-align: center;">
        <h2>⏳ Chargement...</h2>
        <p>Vérification de votre accès.</p>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ilpnwxuecooxthnoxyws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscG53eHVlY29veHRobm94eXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTYxNTcsImV4cCI6MjA5MzI5MjE1N30.0iwBXWrLCNcqdfVjAlp8f_F0q6yHQYfLj_SAvLCt9jY';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const BUNNY_LIBRARY_ID = 666723;

    // Liste des vidéos Baptiste
    const videos = [
        { id: 'bf3f48b2-1be1-4d5d-8fe4-c64ab062c1a5', title: '🎪 Spectacle 1' },
        { id: '7727be43-154f-4350-bb62-b26dd8ca0a8b', title: '🎭 Spectacle 2' },
        { id: '04a7421d-9ed5-4ed6-8576-05e64196fa78', title: '✨ Spectacle 3' },
        { id: '8be709e8-2068-4f47-a1d6-7c5ce4614a3a', title: '🌟 Spectacle 4' },
        { id: 'abbaf945-39e1-4485-8b1a-006d7d0a99c8', title: '🌟 Spectacle 5' }
    ];

    // ========== AVATAR & MENU UTILISATEUR ==========
    let dropdownTimeout;

    async function updateNavbarAvatar() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const userMenu = document.getElementById('user-menu');
        const connexionBtn = document.getElementById('connexion-btn');
        const abonnementLink = document.getElementById('abonnement-link');
        const userAvatar = document.getElementById('user-avatar');
        const dropdown = document.querySelector('.user-dropdown');
        
        if (user) {
            if (connexionBtn) connexionBtn.style.display = 'none';
            if (userMenu) userMenu.style.display = 'block';
            
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('subscription_status')
                .eq('id', user.id)
                .single();
            
            const isPremium = profile?.subscription_status === 'active';
            const avatarLetter = user.email?.charAt(0).toUpperCase() || '?';
            
            if (userAvatar) {
                userAvatar.textContent = avatarLetter;
                if (isPremium) {
                    userAvatar.classList.add('premium');
                    if (abonnementLink) abonnementLink.style.display = 'none';
                } else {
                    userAvatar.classList.remove('premium');
                    if (abonnementLink) abonnementLink.style.display = 'flex';
                }
            }
            
            const logoutBtn = document.getElementById('logout-btn-nav');
            if (logoutBtn) {
                const newLogoutBtn = logoutBtn.cloneNode(true);
                logoutBtn.parentNode.replaceChild(newLogoutBtn, logoutBtn);
                newLogoutBtn.addEventListener('click', async () => {
                    await supabaseClient.auth.signOut();
                    window.location.reload();
                });
            }
        } else {
            if (userMenu) userMenu.style.display = 'none';
            if (connexionBtn) connexionBtn.style.display = 'flex';
            if (abonnementLink) abonnementLink.style.display = 'flex';
        }
    }

    async function getSignedUrl(videoId) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return null;

        const response = await fetch(`${SUPABASE_URL}/functions/v1/bunny-token`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${session.access_token}`
            },
            body: JSON.stringify({ videoId })
        });
        
        const data = await response.json();
        return data.url;
    }

    async function changeVideo(videoId, videoTitle, thumbElement) {
        const titleEl = document.querySelector('.video-title');
        const iframe = document.getElementById('video-iframe');
        
        titleEl.innerHTML = `🎬 ${videoTitle} (chargement...)`;
        
        const url = await getSignedUrl(videoId);
        
        if (url) {
            iframe.src = url;
            titleEl.innerHTML = `🎬 ${videoTitle}`;
            
            document.querySelectorAll('.video-thumb').forEach(thumb => {
                thumb.classList.remove('active');
            });
            thumbElement.classList.add('active');
        } else {
            titleEl.innerHTML = `🎬 ${videoTitle} (erreur de chargement)`;
            console.error("Impossible de charger la vidéo", videoId);
        }
    }

    async function checkAccess() {
        const container = document.getElementById('main-content');
        const { data: { user } } = await supabaseClient.auth.getUser();

        if (!user) {
            container.innerHTML = `
                <div class="locked-box">
                    <h2>🔒 Contenu réservé aux membres</h2>
                    <p>Connectez-vous pour accéder aux vidéos exclusives.</p>
                    <a href="connexion.html" class="btn">🎪 Se connecter</a>
                </div>
            `;
            return;
        }

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('subscription_status')
            .eq('id', user.id)
            .single();

        const isPremium = (profile && profile.subscription_status === 'active');

        if (!isPremium) {
            container.innerHTML = `
                <div class="locked-box">
                    <h2>🌟 Devenez membre Premium</h2>
                    <p>Abonnez-vous à 5€/an pour accéder à toutes nos vidéos exclusives.</p>
                    <a href="Abonnement.html" class="btn">✨ Devenir Premium</a>
                </div>
            `;
            return;
        }

        let thumbsHtml = '';
        videos.forEach((video, index) => {
            const activeClass = index === 0 ? 'active' : '';
            thumbsHtml += `
                <div class="video-thumb ${activeClass}" data-id="${video.id}" data-title="${video.title}">
                    ${video.title}
                </div>
            `;
        });

        container.innerHTML = `
            <div class="video-box">
                <h1 class="video-title">🎬 Chargement...</h1>
                <div class="video-wrapper">
                    <iframe id="video-iframe" src="about:blank" allowfullscreen></iframe>
                </div>
                <div class="video-list">
                    ${thumbsHtml}
                </div>
            </div>
        `;

        const firstVideo = videos[0];
        const firstUrl = await getSignedUrl(firstVideo.id);
        const iframe = document.getElementById('video-iframe');
        const titleEl = document.querySelector('.video-title');
        
        if (firstUrl) {
            iframe.src = firstUrl;
            titleEl.innerHTML = `🎬 ${firstVideo.title}`;
        } else {
            titleEl.innerHTML = `🎬 ${firstVideo.title} (erreur)`;
        }

        document.querySelectorAll('.video-thumb').forEach(thumb => {
            thumb.addEventListener('click', () => {
                const videoId = thumb.getAttribute('data-id');
                const videoTitle = thumb.getAttribute('data-title');
                changeVideo(videoId, videoTitle, thumb);
            });
        });
    }

    window.addEventListener('load', async function() {
        await updateNavbarAvatar();
        await checkAccess();
    });
    
    supabaseClient.auth.onAuthStateChange(() => {
        updateNavbarAvatar();
    });
</script>
</body>
</html>
