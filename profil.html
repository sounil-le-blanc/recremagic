<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Récré Magic</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Récré Magic">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --vert-caravane: #7CB69F;
            --rose-spectacle: #EC407A;
            --jaune-accent: #FFB300;
            --text-dark: #2C1810;
            --text-light: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @media (min-width: 1024px) {
    body {
        zoom: 150%;
    }
    body::before {
        zoom: 0.6667; /* annule le zoom sur le fond */
    }
}

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--rose-spectacle), var(--vert-caravane)); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(135deg, var(--vert-caravane), var(--rose-spectacle)); }

        body {
            font-family: 'Quicksand', sans-serif;
            background-image: url('images/fond-image.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding-top: 100px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
            pointer-events: none;
        }

        .navbar {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px); z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); height: 55px;
        }
        .navbar-container {
            width: 100%; height: 100%; padding: 0 1.2rem;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: nowrap;
        }
        .nav-left-group { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; z-index: 2; }
        .logo-wrapper { text-decoration: none; transition: all 0.25s ease; line-height: 0; }
        .logo-wrapper img { height: 120px; transition: transform 0.25s; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8)); margin-top: 60px; }
        .logo-wrapper:hover img { transform: scale(1.08); filter: drop-shadow(0 6px 18px rgba(0,0,0,0.9)); }
        .back-arrow {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 1.1rem; text-decoration: none; cursor: pointer;
            transition: all 0.25s ease; flex-shrink: 0;
        }
        .back-arrow:hover { background: rgba(255,255,255,0.2); border-color: #FFB300; color: #FFB300; box-shadow: 0 0 12px rgba(255,179,0,0.3); }
        .nav-icons { display: flex; gap: 1.2rem; align-items: center; flex-shrink: 0; flex-wrap: nowrap; z-index: 2; }
        .icon-wrapper { display: flex; flex-direction: column; align-items: center; gap: 0.1rem; text-decoration: none; transition: all 0.2s ease; }
        .nav-icon-img { height: 32px; width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); transition: transform 0.2s; }
        .icon-wrapper:hover .nav-icon-img { transform: scale(1.15); }
        .icon-wrapper .icon-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.7); transition: color 0.2s; white-space: nowrap; }
        .icon-wrapper:hover .icon-label { color: #FFB300; }

        .main-content {
            position: relative; z-index: 10;
            text-align: center; padding: 2rem;
            max-width: 650px; width: 100%;
        }

        .message-box {
            background: rgba(235, 215, 185, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 60px; padding: 3rem 2rem;
            border: 5px solid #7a5c3e;
            outline: 4px solid #5a3e2a;
            outline-offset: 4px;
            box-shadow: 0 0 0 8px #3e2a1a, 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.8rem; font-weight: 800;
            color: #2C1810; margin-bottom: 0.5rem;
            letter-spacing: 2px; text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .welcome-message {
            font-size: 1rem; color: #5a3e2a;
            margin-bottom: 1.5rem; font-style: italic;
        }

        .quick-access {
            display: flex; justify-content: center;
            gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem;
        }

        .quick-link {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            background: rgba(255,255,255,0.7);
            border-radius: 40px; text-decoration: none;
            color: var(--text-dark); font-weight: 600;
            font-size: 0.9rem; border: 2px solid #7a5c3e;
            transition: all 0.2s;
        }

        .quick-link:hover {
            background: white; border-color: var(--jaune-accent);
            transform: translateY(-2px);
        }

        .quick-link-icon { font-size: 1.2rem; }

        .profile-info {
            text-align: left; margin-bottom: 1.5rem;
        }

        .profile-info p {
            font-size: 1.1rem; color: #2C1810;
            margin-bottom: 0.6rem; padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.5); border-radius: 30px;
        }

        .profile-info strong { color: #5a3e2a; }

        .status-badge {
            display: inline-block; padding: 0.3rem 1rem;
            border-radius: 30px; font-weight: 700; font-size: 0.9rem;
        }

        .status-active { background: var(--vert-caravane); color: white; }
        .status-inactive { background: #D32F2F; color: white; }

        .btn {
            display: inline-block; padding: 0.8rem 1.8rem;
            border-radius: 50px; text-decoration: none;
            font-weight: bold; font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin: 0.5rem; cursor: pointer;
            border: none; font-family: 'Quicksand', sans-serif;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3); }

        .btn-primary { background: linear-gradient(135deg, var(--vert-caravane), #5a8f78); color: white; }
        .btn-danger { background: linear-gradient(135deg, #D32F2F, var(--rose-spectacle)); color: white; }
        .btn-warning { background: linear-gradient(135deg, var(--jaune-accent), #e6a200); color: #2C1810; }
        .btn-back { background: linear-gradient(135deg, #5a3e2a, #7a5c3e); color: white; }

        #message {
            margin-top: 1rem; font-weight: 600;
            font-size: 0.9rem; min-height: 1.5rem;
        }
        .success { color: #2E7D32; }
        .error { color: #D32F2F; }

        @media (max-width: 600px) {
            body { padding-top: 100px; }
            .navbar { height: 48px; }
            .navbar-container { padding: 0 0.8rem; }
            .logo-wrapper img { height: 80px; margin-top: 30px; }
            .back-arrow { width: 32px; height: 32px; font-size: 1rem; }
            .nav-icon-img { height: 26px; }
            .nav-icons { gap: 0.7rem; }
            .profile-title { font-size: 2rem; }
            .message-box { padding: 2rem 1.5rem; margin: 0 1rem; }
            .btn { display: block; width: 100%; margin: 0.5rem 0; }
            .quick-access { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <div class="nav-left-group">
            <a href="index.html" class="logo-wrapper">
                <img src="images/logo.webp" alt="Récré Magic">
            </a>
            <div class="back-arrow" onclick="history.back()" title="Retour">←</div>
        </div>
        <div class="nav-icons">
            <a href="calendrier.html" class="icon-wrapper">
                <img src="images/icone-calendrier.webp" alt="Calendrier" class="nav-icon-img">
                <span class="icon-label">Calendrier</span>
            </a>
            <a href="boutique.html" class="icon-wrapper">
                <img src="images/icone-boutique.webp" alt="Boutique" class="nav-icon-img">
                <span class="icon-label">Boutique</span>
            </a>
            <a href="Abonnement.html" class="icon-wrapper">
                <img src="images/icone-abonnement.webp" alt="Abonnement" class="nav-icon-img">
                <span class="icon-label">Abonnement</span>
            </a>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="message-box" id="profile-box">
        <h1 class="profile-title">Mon Profil</h1>
        <p style="color:#2C1810;">⏳ Chargement de votre profil...</p>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ilpnwxuecooxthnoxyws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscG53eHVlY29veHRobm94eXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTYxNTcsImV4cCI6MjA5MzI5MjE1N30.0iwBXWrLCNcqdfVjAlp8f_F0q6yHQYfLj_SAvLCt9jY';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadProfile() {
        const box = document.getElementById('profile-box');
        const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

        if (authError || !user) {
            box.innerHTML = `
                <h1 class="profile-title">Mon Profil</h1>
                <p style="color:#2C1810; margin-bottom:1.5rem;">🔒 Vous devez être connecté pour accéder à votre profil.</p>
                <a href="connexion.html" class="btn btn-primary">🎪 Se connecter</a>
                <a href="inscription.html" class="btn btn-warning">✨ S'inscrire</a>
            `;
            return;
        }

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('subscription_status')
            .eq('id', user.id)
            .single();

        const status = (profile && profile.subscription_status === 'active') ? 'Premium' : 'Spectateur';
        const statusClass = (status === 'Premium') ? 'status-active' : 'status-inactive';
        const welcomeMsg = (status === 'Premium') ? 'Merci de faire partie de la troupe ! 🌟' : 'Découvrez nos contenus exclusifs en devenant membre !';
        const btnText = (status === 'Premium') ? '✨ Gérer mon abonnement Premium' : '✨ Devenir Premium';

        box.innerHTML = `
            <h1 class="profile-title">Mon Profil</h1>
            <p class="welcome-message">${welcomeMsg}</p>

            <div class="quick-access">
                <a href="video.html" class="quick-link"><span class="quick-link-icon">🎬</span> Vidéos</a>
                <a href="boutique.html" class="quick-link"><span class="quick-link-icon">💰</span> Boutique</a>
                <a href="calendrier.html" class="quick-link"><span class="quick-link-icon">📅</span> Calendrier</a>
            </div>

            <div class="profile-info">
                <p><strong>📧 Email :</strong> ${user.email}</p>
                <p><strong>📅 Inscrit le :</strong> ${new Date(user.created_at).toLocaleDateString('fr-FR')}</p>
                <p><strong>🎪 Statut :</strong> <span class="status-badge ${statusClass}">✨ ${status}</span></p>
            </div>

            <div id="message"></div>

            <a href="Abonnement.html" class="btn btn-primary">${btnText}</a>
            <button class="btn btn-warning" onclick="changePassword()">🔑 Changer de mot de passe</button>
            <button class="btn btn-danger" onclick="logout()">🚪 Se déconnecter</button>
            <a href="index.html" class="btn btn-back">← Retour à l'accueil</a>
        `;
    }

    async function changePassword() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;
        const { error } = await supabaseClient.auth.resetPasswordForEmail(user.email, {
            redirectTo: window.location.origin + '/connexion.html'
        });
        const msg = document.getElementById('message');
        if (msg) {
            msg.textContent = error ? '❌ Erreur : ' + error.message : '✅ Email envoyé ! Vérifiez votre boîte.';
        }
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    }

    window.addEventListener('load', loadProfile);
</script>
</body>
</html>
