<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Récré Magic</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Récré Magic">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --vert-caravane: #7CB69F;
            --rose-spectacle: #EC407A;
            --jaune-accent: #FFB300;
            --text-dark: #2C1810;
            --text-light: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @media (min-width: 1024px) {
            body { zoom: 150%; }
            body::before { zoom: 0.6667; }
        }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--rose-spectacle), var(--vert-caravane)); border-radius: 10px; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-image: url('images/fond-image.webp');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding-top: 120px;
            padding-bottom: 2rem;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
            pointer-events: none;
        }

        .navbar {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px); z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); height: 55px;
        }
        .navbar-container {
            width: 100%; height: 100%; padding: 0 1.2rem;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: nowrap;
        }
        .nav-left-group { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; z-index: 2; }
        .logo-wrapper { text-decoration: none; transition: all 0.25s ease; line-height: 0; }
        .logo-wrapper img { height: 120px; transition: transform 0.25s; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8)); margin-top: 60px; }
        .logo-wrapper:hover img { transform: scale(1.08); }
        .back-arrow {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 1.1rem; text-decoration: none; cursor: pointer;
            transition: all 0.25s ease; flex-shrink: 0;
        }
        .back-arrow:hover { background: rgba(255,255,255,0.2); border-color: #FFB300; color: #FFB300; box-shadow: 0 0 12px rgba(255,179,0,0.3); }
        .nav-icons { display: flex; gap: 1.2rem; align-items: center; flex-shrink: 0; flex-wrap: nowrap; z-index: 2; }
        .icon-wrapper { display: flex; flex-direction: column; align-items: center; gap: 0.1rem; text-decoration: none; transition: all 0.2s ease; }
        .nav-icon-img { height: 32px; width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); transition: transform 0.2s; }
        .icon-wrapper:hover .nav-icon-img { transform: scale(1.15); }
        .icon-wrapper .icon-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.7); transition: color 0.2s; white-space: nowrap; }
        .icon-wrapper:hover .icon-label { color: #FFB300; }

        .main-content {
            position: relative; z-index: 10;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Profil Card */
        .profile-card {
            background: rgba(235, 215, 185, 0.96);
            border-radius: 48px;
            padding: 2rem;
            border: 5px solid #7a5c3e;
            outline: 4px solid #5a3e2a;
            outline-offset: 4px;
            box-shadow: 0 0 0 8px #3e2a1a, 0 15px 30px rgba(0,0,0,0.5);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .profile-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 2.5rem;
            color: #2C1810;
            margin-bottom: 0.5rem;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--vert-caravane), #5a8f78);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            border: 3px solid var(--jaune-accent);
        }

        .welcome-message {
            font-size: 1rem;
            color: #5a3e2a;
            font-style: italic;
        }

        /* Grid layout */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .info-section {
            background: rgba(255,255,255,0.5);
            border-radius: 24px;
            padding: 1.2rem;
        }

        .info-section h3 {
            font-family: 'MedievalSharp', cursive;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #2C1810;
            border-bottom: 2px solid var(--jaune-accent);
            display: inline-block;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .info-label {
            font-weight: bold;
            color: #5a3e2a;
        }

        .status-badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .status-active { background: var(--vert-caravane); color: white; }
        .status-inactive { background: #D32F2F; color: white; }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1rem;
        }
        .quick-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.7);
            border-radius: 40px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .quick-link:hover {
            background: white;
            transform: translateY(-2px);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .btn {
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            font-family: 'Quicksand', sans-serif;
        }
        .btn-primary { background: linear-gradient(135deg, var(--vert-caravane), #5a8f78); color: white; }
        .btn-warning { background: linear-gradient(135deg, var(--jaune-accent), #e6a200); color: #2C1810; }
        .btn-danger { background: linear-gradient(135deg, #D32F2F, var(--rose-spectacle)); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.7); color: #2C1810; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        #message {
            text-align: center;
            margin-top: 1rem;
            font-weight: 600;
        }
        .success { color: #2E7D32; }
        .error { color: #D32F2F; }

        @media (max-width: 768px) {
            .profile-grid { grid-template-columns: 1fr; }
            .profile-card { padding: 1.5rem; }
            .profile-title { font-size: 1.8rem; }
            .actions { flex-direction: column; align-items: stretch; }
            .btn { text-align: center; }
        }

        @media (max-width: 600px) {
            body { padding-top: 100px; }
            .navbar { height: 48px; }
            .navbar-container { padding: 0 0.8rem; }
            .logo-wrapper img { height: 80px; margin-top: 30px; }
            .nav-icon-img { height: 26px; }
            .nav-icons { gap: 0.7rem; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <div class="nav-left-group">
            <a href="index.html" class="logo-wrapper">
                <img src="images/logo.webp" alt="Récré Magic">
            </a>
            <div class="back-arrow" onclick="history.back()" title="Retour">←</div>
        </div>
        <div class="nav-icons">
            <a href="calendrier.html" class="icon-wrapper">
                <img src="images/icone-calendrier.webp" alt="Calendrier" class="nav-icon-img">
                <span class="icon-label">Calendrier</span>
            </a>
            <a href="boutique.html" class="icon-wrapper">
                <img src="images/icone-boutique.webp" alt="Boutique" class="nav-icon-img">
                <span class="icon-label">Boutique</span>
            </a>
            <a href="Abonnement.html" class="icon-wrapper">
                <img src="images/icone-abonnement.webp" alt="Abonnement" class="nav-icon-img">
                <span class="icon-label">Abonnement</span>
            </a>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="profile-card" id="profile-card">
        <div style="text-align: center; padding: 2rem;">
            <p>⏳ Chargement de votre profil...</p>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ilpnwxuecooxthnoxyws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscG53eHVlY29veHRobm94eXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTYxNTcsImV4cCI6MjA5MzI5MjE1N30.0iwBXWrLCNcqdfVjAlp8f_F0q6yHQYfLj_SAvLCt9jY';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Stripe Customer Portal
    async function manageSubscription() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;
        
        const response = await fetch(`${SUPABASE_URL}/functions/v1/stripe-portal`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: user.id, email: user.email })
        });
        const data = await response.json();
        if (data.url) {
            window.location.href = data.url;
        } else {
            alert('Erreur : ' + (data.error || 'Impossible d\'accéder au portail'));
        }
    }

    async function changePassword() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;
        const { error } = await supabaseClient.auth.resetPasswordForEmail(user.email, {
            redirectTo: window.location.origin + '/connexion.html'
        });
        const msgDiv = document.getElementById('message');
        if (msgDiv) {
            msgDiv.innerHTML = error ? '❌ ' + error.message : '✅ Email envoyé ! Vérifiez votre boîte.';
            msgDiv.className = error ? 'error' : 'success';
            setTimeout(() => { msgDiv.innerHTML = ''; }, 5000);
        }
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    }

    async function loadProfile() {
        const card = document.getElementById('profile-card');
        const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

        if (authError || !user) {
            card.innerHTML = `
                <div style="text-align: center; padding: 2rem;">
                    <h1 class="profile-title">Mon Profil</h1>
                    <p style="margin-bottom: 1.5rem;">🔒 Vous devez être connecté</p>
                    <a href="connexion.html" class="btn btn-primary">🎪 Se connecter</a>
                    <a href="inscription.html" class="btn btn-warning">✨ S'inscrire</a>
                </div>
            `;
            return;
        }

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('subscription_status')
            .eq('id', user.id)
            .single();

        const isPremium = profile && profile.subscription_status === 'active';
        const statusText = isPremium ? 'Premium' : 'Spectateur';
        const statusClass = isPremium ? 'status-active' : 'status-inactive';
        const avatarLetter = user.email?.charAt(0).toUpperCase() || '?';

        card.innerHTML = `
            <div class="profile-header">
                <div class="avatar">${avatarLetter}</div>
                <h1 class="profile-title">Mon Compte</h1>
                <p class="welcome-message">${isPremium ? '🌟 Merci de faire partie de la troupe !' : '✨ Découvrez nos vidéos exclusives'}</p>
            </div>

            <div class="profile-grid">
                <div class="info-section">
                    <h3>📋 Informations</h3>
                    <div class="info-row">
                        <span class="info-label">📧 Email</span>
                        <span>${user.email}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">📅 Inscrit le</span>
                        <span>${new Date(user.created_at).toLocaleDateString('fr-FR')}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">🎪 Statut</span>
                        <span><span class="status-badge ${statusClass}">✨ ${statusText}</span></span>
                    </div>
                </div>

                <div class="info-section">
                    <h3>🔗 Accès rapide</h3>
                    <div class="quick-links">
                        <a href="video.html" class="quick-link">🎬 Vidéos</a>
                        <a href="boutique.html" class="quick-link">💰 Boutique</a>
                        <a href="calendrier.html" class="quick-link">📅 Calendrier</a>
                    </div>
                    <div style="margin-top: 1rem;">
                        <div class="info-row">
                            <span class="info-label">🎁 Réduction</span>
                            <span>${isPremium ? '5% sur la boutique' : 'Devenez premium'}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="actions">
                ${isPremium ? '<button class="btn btn-primary" onclick="manageSubscription()">🎪 Gérer mon abonnement</button>' : '<a href="Abonnement.html" class="btn btn-primary">✨ Devenir Premium</a>'}
                <button class="btn btn-warning" onclick="changePassword()">🔑 Changer de mot de passe</button>
                <button class="btn btn-danger" onclick="logout()">🚪 Se déconnecter</button>
                <a href="index.html" class="btn btn-secondary">← Retour à l'accueil</a>
            </div>

            <div id="message"></div>
        `;
    }

    window.addEventListener('load', loadProfile);
    window.manageSubscription = manageSubscription;
    window.changePassword = changePassword;
    window.logout = logout;
</script>
</body>
</html>
