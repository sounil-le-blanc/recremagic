<script>

    const SUPABASE_URL = 'https://ilpnwxuecooxthnoxyws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscG53eHVlY29veHRobm94eXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTYxNTcsImV4cCI6MjA5MzI5MjE1N30.0iwBXWrLCNcqdfVjAlp8f_F0q6yHQYfLj_SAvLCt9jY';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentContrat = 0;
    let signatureCanvas = {};
    let currentTitre = "";

    let signaturesSauvegardees = {};

    const titresPossibles = [
        "DU COUP on vient chez vous",
        "DU COUP on revient chez vous",
        "COMME SUR DES ROULETTES",
        "DÉLICIEUSEMENT MABOUL"
    ];

    const nbArtistesPossibles = ["1", "2", "3", "4", "5"];

    function toggleDropdown() {
        document.getElementById("contratDropdown").classList.toggle("show");
    }
    window.onclick = function(e) {
        if (!e.target.matches('.btn-contrat')) {
            let drop = document.getElementById("contratDropdown");
            if (drop.classList.contains('show')) drop.classList.remove('show');
        }
    }

    function initSignatureCanvas(canvasId) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        
        if (signaturesSauvegardees[canvasId]) {
            const img = new Image();
            img.onload = function() {
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
            img.src = signaturesSauvegardees[canvasId];
        }
        
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        
        if (!signaturesSauvegardees[canvasId]) {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        ctx.strokeStyle = '#2C1810';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        
        let drawing = false;

        function startDraw(e) {
            drawing = true;
            const pos = getPos(canvas, e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }
        function draw(e) {
            if (!drawing) return;
            const pos = getPos(canvas, e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }
        function stopDraw() { drawing = false; }
        function getPos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (evt.touches) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            } else {
                clientX = evt.clientX;
                clientY = evt.clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }
        
        canvas.removeEventListener('mousedown', startDraw);
        canvas.removeEventListener('mousemove', draw);
        canvas.removeEventListener('mouseup', stopDraw);
        canvas.removeEventListener('mouseleave', stopDraw);
        canvas.removeEventListener('touchstart', startDraw);
        canvas.removeEventListener('touchmove', draw);
        canvas.removeEventListener('touchend', stopDraw);
        
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);
        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDraw);
        
        signatureCanvas[canvasId] = { canvas, ctx, clear: function() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            delete signaturesSauvegardees[canvasId];
        }};
    }

                body: {

                    lieu: donnees.lieu,
                    date: donnees.date,
