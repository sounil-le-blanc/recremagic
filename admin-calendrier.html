<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin calendrier - Récré Magic</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --vert-caravane: #7CB69F;
            --rose-spectacle: #EC407A;
            --jaune-accent: #FFB300;
            --text-dark: #2C1810;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--vert-caravane); border-radius: 10px; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-image: url('images/fond-image.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: 0;
            pointer-events: none;
        }

        .admin-wrapper {
            position: relative;
            z-index: 10;
            max-width: 1050px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: rgba(235,215,185,0.96);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 1.8rem;
            border: 5px solid #7a5c3e;
            outline: 4px solid #5a3e2a;
            outline-offset: 4px;
            box-shadow: 0 0 0 8px #3e2a1a, 0 15px 30px rgba(0,0,0,0.3);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .admin-header h1 {
            font-family: 'MedievalSharp', cursive;
            color: #f5d06b;
            font-size: 2rem;
            text-shadow: 2px 2px 0 #3e6b3a;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            border: none;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--vert-caravane); color: white; }
        .btn-primary:hover { background: #5a8f78; }
        .btn-danger { background: #D32F2F; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        input, textarea, select {
            width: 100%;
            padding: 0.7rem;
            margin: 0.5rem 0;
            border-radius: 30px;
            border: 1.5px solid #c4a882;
            background: #fefefe;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .mode-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .mode-tab {
            flex: 1; padding: 0.5rem; border-radius: 30px;
            background: #ddd; color: #555; text-align: center;
            cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .mode-tab.active { background: var(--jaune-accent); color: #2C1810; }

        .period-summary {
            background: #C8E6C9; padding: 0.4rem 1rem;
            border-radius: 15px; margin: 0.5rem 0;
            font-size: 0.85rem; text-align: center; display: none;
        }
        .period-summary.visible { display: block; }

        .weekday-checkboxes { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center; }
        .weekday-checkbox {
            padding: 0.3rem 0.6rem; background: #f0f0f0;
            border-radius: 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 0.2rem;
        }
        .weekday-checkbox input { width: auto; margin: 0; }

        .hidden { display: none !important; }

        /* Autocomplete */
        .autocomplete-wrapper { position: relative; }
        .autocomplete-suggestions {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; border: 2px solid #7a5c3e; border-radius: 0 0 20px 20px;
            max-height: 200px; overflow-y: auto; z-index: 50; display: none;
        }
        .autocomplete-suggestions.active { display: block; }
        .autocomplete-item { padding: 0.6rem 1rem; cursor: pointer; border-bottom: 1px solid #eee; }
        .autocomplete-item:hover { background: #FFF3CD; }

        /* Calendrier */
        .calendar-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .month-year-nav { display: flex; align-items: center; gap: 0.8rem; background: rgba(0,0,0,0.05); padding: 0.4rem 1rem; border-radius: 50px; }
        .nav-arrow { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--vert-caravane); color: white; cursor: pointer; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.4rem; }
        .weekday-header { font-weight: bold; color: var(--rose-spectacle); padding: 0.6rem 0; font-size: 0.8rem; }
        .cal-day {
            background: rgba(255,255,255,0.7); border-radius: 15px; padding: 0.6rem 0;
            cursor: pointer; transition: 0.15s; min-height: 40px; display: flex; align-items: center; justify-content: center;
        }
        .cal-day:hover { transform: scale(1.05); background: var(--jaune-accent); }
        .cal-day.has-event { background: #FFE082 !important; font-weight: bold; }
        .cal-day.today { background: var(--rose-spectacle) !important; color: white !important; }
        .cal-day.other-month { opacity: 0.3; pointer-events: none; }

        /* Popup */
        .events-popup {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .events-popup.active { display: flex; }
        .popup-content { background: white; border-radius: 25px; padding: 1.5rem; width: 90%; max-width: 500px; border: 4px solid var(--vert-caravane); }
        
        .popup-event-item { background: #f9f9f9; padding: 0.8rem; margin-bottom: 0.5rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-delete { background: #D32F2F; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="admin-wrapper">
    <div class="card admin-header">
        <h1>🎪 Admin Calendrier</h1>
        <div style="font-size:0.8rem; color:#4CAF50;">● Base de données active</div>
    </div>

    <div class="card">
        <h2 style="margin-bottom:1rem;">➕ Ajouter un événement</h2>
        <div class="mode-tabs">
            <div class="mode-tab active" id="modeSingle">📅 Date unique</div>
            <div class="mode-tab" id="modePeriod">📆 Période</div>
        </div>

        <form id="eventForm">
            <div id="singleDateFields">
                <label>Date *</label>
                <input type="date" id="eventDate" required>
            </div>

            <div id="periodFields" class="hidden">
                <div class="form-row">
                    <div><label>Début *</label><input type="date" id="periodStart"></div>
                    <div><label>Fin *</label><input type="date" id="periodEnd"></div>
                </div>
                <div class="period-summary" id="periodSummary"></div>
                <div class="weekday-checkboxes">
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="1" checked> Lun</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="2" checked> Mar</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="3" checked> Mer</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="4" checked> Jeu</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="5" checked> Ven</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="6" checked> Sam</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="0"> Dim</label>
                </div>
            </div>

            <div class="form-row">
                <div><label>Type</label>
                    <select id="eventType">
                        <option value="Spectacle">🎭 Spectacle</option>
                        <option value="Exposition">🖼️ Exposition</option>
                    </select>
                </div>
                <div><label>Titre</label>
                    <select id="eventTitle" required><option value="">-- Sélectionnez --</option></select>
                </div>
            </div>

            <label>Lieu</label>
            <div class="autocomplete-wrapper">
                <textarea id="eventLieu" rows="2" placeholder="Commune..."></textarea>
                <div class="autocomplete-suggestions" id="lieuSuggestions"></div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; margin-top:1rem;">💾 Enregistrer</button>
        </form>
    </div>

    <div class="card">
        <div class="calendar-header-row">
            <div class="month-year-nav">
                <button class="nav-arrow" onclick="changeMonth(-1)">←</button>
                <span id="monthName"></span>
                <button class="nav-arrow" onclick="changeMonth(1)">→</button>
            </div>
            <select id="yearSelect" style="width:auto; margin:0;"></select>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
</div>

<div class="events-popup" id="eventsPopup">
    <div class="popup-content" id="popupContent"></div>
</div>

<script>
    const SUPABASE_URL = 'https://ilpnwxuecooxthnoxyws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscG53eHVlY29veHRobm94eXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTYxNTcsImV4cCI6MjA5MzI5MjE1N30.0iwBXWrLCNcqdfVjAlp8f_F0q6yHQYfLj_SAvLCt9jY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentMode = 'single';
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    let eventsData = {};
    let communesList = [];

    const monthNames = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
    const SPECTACLES = ["DU COUP ON VIENT CHEZ VOUS","DU COUP on revient chez vous","COMME SUR DES ROULETTES","DÉLICIEUSEMENT MABOUL"];
    const EXPOSITIONS = ["LA FÉERIE DES MARIONNETTES","LES GÉANTS DU CARNAVAL"];

    // --- LOGIQUE BASE ---
    async function loadAllEvents() {
        const { data, error } = await supabase.from('events').select('*');
        if (error) return console.error(error);
        eventsData = {};
        data.forEach(ev => {
            if (!eventsData[ev.event_date]) eventsData[ev.event_date] = [];
            eventsData[ev.event_date].push(ev);
        });
        renderCalendar();
    }

    function renderCalendar() {
        const firstDay = new Date(currentYear, currentMonth, 1);
        let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const today = new Date().toISOString().split('T')[0];

        let html = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(d => `<div class="weekday-header">${d}</div>`).join('');
        for (let i = 0; i < startOffset; i++) html += `<div class="cal-day other-month"></div>`;

        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const hasEvent = eventsData[dateStr] && eventsData[dateStr].length > 0;
            const isToday = dateStr === today;
            html += `<div class="cal-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}" onclick="openPopup('${dateStr}')">${d}</div>`;
        }
        document.getElementById('calendarGrid').innerHTML = html;
        document.getElementById('monthName').textContent = `${monthNames[currentMonth]} ${currentYear}`;
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        document.getElementById('yearSelect').value = currentYear;
        renderCalendar();
    }

    // --- POPUP ---
    function openPopup(dateStr) {
        const events = eventsData[dateStr] || [];
        let html = `<h3>📅 ${dateStr.split('-').reverse().join('/')}</h3>`;
        if (events.length === 0) html += `<p style="text-align:center; padding:1rem; color:#888;">Aucun événement</p>`;
        else events.forEach(ev => {
            html += `<div class="popup-event-item">
                <div><strong>${ev.titre}</strong><br><small>📍 ${ev.lieu || 'Non défini'}</small></div>
                <button class="btn-delete" onclick="deleteEvent('${ev.id}')">🗑</button>
            </div>`;
        });
        html += `<button class="btn" style="width:100%; background:#aaa; color:white; margin-top:1rem;" onclick="closePopup()">Fermer</button>`;
        document.getElementById('popupContent').innerHTML = html;
        document.getElementById('eventsPopup').classList.add('active');
    }

    function closePopup() { document.getElementById('eventsPopup').classList.remove('active'); }

    window.deleteEvent = async (id) => {
        if (!confirm("Supprimer ?")) return;
        await supabase.from('events').delete().eq('id', id);
        await loadAllEvents();
        closePopup();
    };

    // --- FORMULAIRE ---
    document.getElementById('modeSingle').onclick = () => switchMode('single');
    document.getElementById('modePeriod').onclick = () => switchMode('period');

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('modeSingle').classList.toggle('active', mode === 'single');
        document.getElementById('modePeriod').classList.toggle('active', mode === 'period');
        document.getElementById('singleDateFields').classList.toggle('hidden', mode !== 'single');
        document.getElementById('periodFields').classList.toggle('hidden', mode !== 'period');
    }

    document.getElementById('eventForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;

        const type = document.getElementById('eventType').value;
        const titre = document.getElementById('eventTitle').value;
        const lieu = document.getElementById('eventLieu').value;
        let dates = [];

        if (currentMode === 'single') dates.push(document.getElementById('eventDate').value);
        else {
            let start = new Date(document.getElementById('periodStart').value);
            let end = new Date(document.getElementById('periodEnd').value);
            const selectedDays = Array.from(document.querySelectorAll('.weekday-filter:checked')).map(cb => parseInt(cb.value));
            while (start <= end) {
                if (selectedDays.includes(start.getDay())) dates.push(start.toISOString().split('T')[0]);
                start.setDate(start.getDate() + 1);
            }
        }

        const toInsert = dates.map(d => ({ event_date: d, type, titre, lieu }));
        await supabase.from('events').insert(toInsert);
        await loadAllEvents();
        btn.disabled = false;
        alert("Ajouté !");
    };

    // --- AUTOCOMPLETE & DROPDOWNS ---
    function updateTitles() {
        const list = document.getElementById('eventType').value === 'Spectacle' ? SPECTACLES : EXPOSITIONS;
        document.getElementById('eventTitle').innerHTML = '<option value="">-- Sélectionnez --</option>' + list.map(t => `<option value="${t}">${t}</option>`).join('');
    }
    document.getElementById('eventType').onchange = updateTitles;

    async function loadCommunes() {
        const res = await fetch('https://raw.githubusercontent.com/kevin-robert/communes-francaises/main/communes.json');
        communesList = await res.json();
    }

    document.getElementById('eventLieu').oninput = function() {
        const val = this.value.toLowerCase();
        const suggs = document.getElementById('lieuSuggestions');
        if (val.length < 2) return suggs.classList.remove('active');
        const matches = communesList.filter(c => c.nom.toLowerCase().startsWith(val)).slice(0, 5);
        suggs.innerHTML = matches.map(c => `<div class="autocomplete-item" onclick="selectCommune('${c.nom} (${c.code_postal})')">${c.nom} (${c.code_postal})</div>`).join('');
        suggs.classList.add('active');
    };

    window.selectCommune = (val) => {
        document.getElementById('eventLieu').value = val;
        document.getElementById('lieuSuggestions').classList.remove('active');
    };

    // --- INIT ---
    const ys = document.getElementById('yearSelect');
    for (let i = 2024; i <= 2030; i++) ys.innerHTML += `<option value="${i}">${i}</option>`;
    ys.value = currentYear;
    ys.onchange = () => { currentYear = parseInt(ys.value); renderCalendar(); };

    updateTitles();
    loadCommunes();
    loadAllEvents();
</script>
</body>
</html>
