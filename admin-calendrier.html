<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin calendrier - Récré Magic</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ... (gardez tout le CSS actuel) ... */
    </style>
</head>
<body>

<div class="admin-wrapper">
    <!-- HEADER -->
    <div class="card admin-header">
        <h1>🎪 Admin Calendrier</h1>
        <div class="connection-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Connexion...</span>
        </div>
        <button class="btn btn-danger" id="clearAllBtn" style="width:auto;">🗑 Tout effacer</button>
    </div>

    <!-- FORMULAIRE -->
    <div class="card">
        <h2 style="color:var(--text-dark); margin-bottom:1rem;">➕ Ajouter un événement</h2>

        <div class="mode-tabs">
            <div class="mode-tab active" id="modeSingle">📅 Date unique</div>
            <div class="mode-tab" id="modePeriod">📆 Période</div>
        </div>

        <form id="eventForm">
            <div id="singleDateFields">
                <label>Date *</label>
                <input type="date" id="eventDate" required min="2026-01-01" max="2028-12-31">
            </div>

            <div id="periodFields" class="hidden">
                <div class="form-row">
                    <div><label>Date début *</label><input type="date" id="periodStart" min="2026-01-01" max="2028-12-31"></div>
                    <div><label>Date fin *</label><input type="date" id="periodEnd" min="2026-01-01" max="2028-12-31"></div>
                </div>
                <div class="period-summary" id="periodSummary"></div>
                <label style="margin-top:0.3rem; font-size:0.85rem;">Jours à inclure :</label>
                <div class="weekday-checkboxes">
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="1" checked> Lun</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="2" checked> Mar</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="3" checked> Mer</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="4" checked> Jeu</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="5" checked> Ven</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="6" checked> Sam</label>
                    <label class="weekday-checkbox"><input type="checkbox" class="weekday-filter" value="0"> Dim</label>
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>Type</label>
                    <select id="eventType">
                        <option value="Spectacle">🎭 Spectacle</option>
                        <option value="Exposition">🖼️ Exposition</option>
                    </select>
                </div>
                <div>
                    <label>Titre</label>
                    <select id="eventTitle" required>
                        <option value="">-- Sélectionnez --</option>
                    </select>
                </div>
            </div>

            <label>Lieu</label>
            <div class="autocomplete-wrapper">
                <textarea id="eventLieu" rows="2" placeholder="Commencez à taper une commune..."></textarea>
                <div class="autocomplete-suggestions" id="lieuSuggestions"></div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; margin-top:0.5rem;">💾 Enregistrer</button>
        </form>
    </div>

    <!-- CALENDRIER -->
    <div class="card">
        <div class="calendar-header-row">
            <div class="month-year-nav">
                <button class="nav-arrow" id="prevMonthBtn">←</button>
                <span id="monthName"></span>
                <button class="nav-arrow" id="nextMonthBtn">→</button>
            </div>
            <div class="year-select-wrap">
                <label for="yearSelect">Année :</label>
                <select id="yearSelect"></select>
            </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <p class="legend">
            🟡 = événement(s) &nbsp;|&nbsp; 🔴 = aujourd'hui &nbsp;|&nbsp; Cliquez sur une date pour gérer
        </p>
    </div>
</div>

<!-- POPUP -->
<div class="events-popup" id="eventsPopup">
    <div class="popup-content" id="popupContent"></div>
</div>

<script>
    // ============================================================
    // CONFIGURATION SUPABASE
    // ============================================================
    const SUPABASE_URL = 'https://ilpnwxuecooxthnoxyws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscG53eHVlY29veHRobm94eXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTYxNTcsImV4cCI6MjA5MzI5MjE1N30.0iwBXWrLCNcqdfVjAlp8f_F0q6yHQYfLj_SAvLCt9jY';
    const TABLE_NAME = 'events';

    let supabase = null;
    let eventsData = {};
    let communesList = [];
    let isOnline = false;

    const monthNames = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
    const weekdays = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
    const SPECTACLES = ["DU COUP ON VIENT CHEZ VOUS","DU COUP on revient chez vous","COMME SUR DES ROULETTES","DÉLICIEUSEMENT MABOUL"];
    const EXPOSITIONS = ["LA FÉERIE DES MARIONNETTES","LES GÉANTS DU CARNAVAL"];

    let currentMode = 'single';
    let currentMonth, currentYear;

    const now = new Date();
    currentMonth = now.getMonth();
    currentYear = now.getFullYear();
    if (currentYear < 2026) currentYear = 2026;
    if (currentYear > 2028) currentYear = 2028;

    // ============================================================
    // INIT SUPABASE (CORRIGÉ)
    // ============================================================
    async function initSupabase() {
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); // ← CORRIGÉ ICI
            console.log('✅ Client Supabase initialisé');
            await loadFromSupabase();
        } catch (e) {
            console.error('❌ Erreur initialisation Supabase :', e);
            updateConnectionStatus(false);
            loadFromLocalStorage();
        }
    }

    async function loadFromSupabase() {
        if (!supabase) {
            loadFromLocalStorage();
            return;
        }
        
        try {
            const { data, error } = await supabase
                .from(TABLE_NAME)
                .select('*')
                .order('event_date', { ascending: true });
            
            if (error) throw error;
            
            // Fusionner avec les données locales
            const localData = loadFromLocalStorage(true);
            
            eventsData = {};
            if (data && data.length > 0) {
                data.forEach(ev => {
                    if (!eventsData[ev.event_date]) {
                        eventsData[ev.event_date] = [];
                    }
                    eventsData[ev.event_date].push(ev);
                });
                // Sauvegarder en local pour le mode hors-ligne
                saveToLocalStorage();
                updateConnectionStatus(true);
            } else if (Object.keys(localData).length > 0) {
                eventsData = localData;
                updateConnectionStatus(false);
            } else {
                updateConnectionStatus(false);
            }
            
            renderCalendar();
            console.log('✅ Données chargées :', Object.keys(eventsData).length, 'dates');
        } catch (e) {
            console.error('❌ Erreur chargement Supabase :', e);
            updateConnectionStatus(false);
            loadFromLocalStorage();
        }
    }

    function updateConnectionStatus(connected) {
        isOnline = connected;
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        if (connected) {
            dot.className = 'status-dot connected';
            text.textContent = 'Connecté • Supabase';
        } else {
            dot.className = 'status-dot disconnected';
            text.textContent = 'Mode local';
        }
    }

    // ============================================================
    // SUPABASE CRUD (AMÉLIORÉ)
    // ============================================================
    async function saveEventToSupabase(eventData) {
        if (!supabase || !isOnline) return false;
        
        try {
            const { error } = await supabase
                .from(TABLE_NAME)
                .insert([eventData]);
            
            if (error) throw error;
            return true;
        } catch (e) {
            console.error('❌ Erreur sauvegarde Supabase :', e);
            return false;
        }
    }

    async function updateEventInSupabase(eventId, updates) {
        if (!supabase || !isOnline) return false;
        
        try {
            const { error } = await supabase
                .from(TABLE_NAME)
                .update(updates)
                .eq('id', eventId);
            
            if (error) throw error;
            return true;
        } catch (e) {
            console.error('❌ Erreur mise à jour Supabase :', e);
            return false;
        }
    }

    async function deleteEventFromSupabase(eventId) {
        if (!supabase || !isOnline) return false;
        
        try {
            const { error } = await supabase
                .from(TABLE_NAME)
                .delete()
                .eq('id', eventId);
            
            if (error) throw error;
            return true;
        } catch (e) {
            console.error('❌ Erreur suppression Supabase :', e);
            return false;
        }
    }

    async function deletePeriodFromSupabase(periodId) {
        if (!supabase || !isOnline) return false;
        
        try {
            const { error } = await supabase
                .from(TABLE_NAME)
                .delete()
                .eq('period_id', periodId);
            
            if (error) throw error;
            return true;
        } catch (e) {
            console.error('❌ Erreur suppression période Supabase :', e);
            return false;
        }
    }

    // ============================================================
    // STOCKAGE LOCAL (AMÉLIORÉ)
    // ============================================================
    function saveToLocalStorage() {
        const toSave = {};
        for (let key in eventsData) {
            toSave[key] = eventsData[key].map(ev => ({
                id: ev.id,
                event_date: ev.event_date,
                type: ev.type,
                titre: ev.titre,
                lieu: ev.lieu,
                period_id: ev.period_id
            }));
        }
        localStorage.setItem('recremagic_calendar', JSON.stringify(toSave));
    }

    function loadFromLocalStorage(returnOnly = false) {
        const raw = localStorage.getItem('recremagic_calendar');
        if (!raw) { 
            if (!returnOnly) {
                eventsData = {}; 
                renderCalendar(); 
            }
            return {}; 
        }
        try {
            const data = JSON.parse(raw);
            const formattedData = {};
            for (let key in data) {
                if (Array.isArray(data[key])) {
                    formattedData[key] = data[key].map(ev => ({
                        id: ev.id || 'evt_' + key + '_' + Math.random().toString(36).substr(2,5),
                        event_date: ev.event_date || key,
                        type: ev.type || 'Spectacle',
                        titre: ev.titre || '',
                        lieu: ev.lieu || '',
                        period_id: ev.period_id || null
                    }));
                }
            }
            
            if (returnOnly) return formattedData;
            
            eventsData = formattedData;
            renderCalendar();
            return formattedData;
        } catch (e) {
            console.error('Erreur parsing localStorage :', e);
            if (returnOnly) return {};
            eventsData = {};
            renderCalendar();
            return {};
        }
    }

    function getEventsForDate(year, month, day) {
        const key = `${year}-${month+1}-${day}`;
        return eventsData[key] || [];
    }

    // ============================================================
    // MODE (IDENTIQUE AU PREMIER CODE)
    // ============================================================
    document.getElementById('modeSingle').addEventListener('click', () => switchMode('single'));
    document.getElementById('modePeriod').addEventListener('click', () => switchMode('period'));

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('modeSingle').classList.toggle('active', mode === 'single');
        document.getElementById('modePeriod').classList.toggle('active', mode === 'period');
        document.getElementById('singleDateFields').classList.toggle('hidden', mode !== 'single');
        document.getElementById('periodFields').classList.toggle('hidden', mode !== 'period');
        document.getElementById('eventDate').required = (mode === 'single');
        document.getElementById('periodStart').required = (mode === 'period');
        document.getElementById('periodEnd').required = (mode === 'period');
        if (mode === 'single') {
            document.getElementById('periodStart').value = '';
            document.getElementById('periodEnd').value = '';
            document.getElementById('periodSummary').classList.remove('visible');
        } else {
            document.getElementById('eventDate').value = '';
            updatePeriodSummary();
        }
    }

    document.getElementById('periodStart').addEventListener('change', updatePeriodSummary);
    document.getElementById('periodEnd').addEventListener('change', updatePeriodSummary);
    document.querySelectorAll('.weekday-filter').forEach(cb => cb.addEventListener('change', updatePeriodSummary));

    function updatePeriodSummary() {
        const start = document.getElementById('periodStart').value;
        const end = document.getElementById('periodEnd').value;
        const summary = document.getElementById('periodSummary');
        if (!start || !end) { summary.classList.remove('visible'); return; }
        if (start > end) {
            summary.textContent = '⚠️ Date début > date fin';
            summary.style.background = '#FFCDD2';
            summary.classList.add('visible'); return;
        }
        const dates = getDatesInRange(start, end);
        if (dates.length === 0) {
            summary.textContent = '⚠️ Aucune date (vérifiez les jours cochés)';
            summary.style.background = '#FFCDD2';
            summary.classList.add('visible'); return;
        }
        summary.textContent = `📆 ${dates.length} jour(s) : du ${formatDateFr(start)} au ${formatDateFr(end)}`;
        summary.style.background = '#C8E6C9';
        summary.classList.add('visible');
    }

    function getDatesInRange(startStr, endStr) {
        const dates = [];
        const start = new Date(startStr + 'T00:00:00');
        const end = new Date(endStr + 'T00:00:00');
        const selectedDays = Array.from(document.querySelectorAll('.weekday-filter:checked')).map(cb => parseInt(cb.value));
        const current = new Date(start);
        while (current <= end) {
            if (selectedDays.includes(current.getDay())) dates.push(new Date(current));
            current.setDate(current.getDate() + 1);
        }
        return dates;
    }

    function dateToKey(date) {
        return `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;
    }

    function formatDateFr(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    // ============================================================
    // AUTOCOMPLETE COMMUNES (IDENTIQUE)
    // ============================================================
    async function loadCommunes() {
        try {
            const res = await fetch('https://raw.githubusercontent.com/kevin-robert/communes-francaises/main/communes.json');
            communesList = await res.json();
            console.log('✅ Communes chargées :', communesList.length);
        } catch (e) {
            console.warn('⚠️ Communes non chargées, autocomplete désactivé');
        }
    }

    const lieuInput = document.getElementById('eventLieu');
    const suggestionsDiv = document.getElementById('lieuSuggestions');
    let selectedCommuneIndex = -1;

    lieuInput.addEventListener('input', () => {
        const query = lieuInput.value.trim().toLowerCase();
        if (query.length < 2 || communesList.length === 0) {
            suggestionsDiv.classList.remove('active');
            return;
        }
        const matches = communesList.filter(c =>
            c.nom.toLowerCase().startsWith(query) || c.code_postal.startsWith(query)
        ).slice(0, 8);

        if (matches.length === 0) {
            suggestionsDiv.classList.remove('active');
            return;
        }

        suggestionsDiv.innerHTML = matches.map((c, i) =>
            `<div class="autocomplete-item" data-index="${i}" data-full="${c.nom} (${c.code_postal})">
                <span class="cp">${c.code_postal}</span> ${c.nom}
            </div>`
        ).join('');
        suggestionsDiv.classList.add('active');
        selectedCommuneIndex = -1;

        suggestionsDiv.querySelectorAll('.autocomplete-item').forEach(item => {
            item.addEventListener('mousedown', (e) => {
                e.preventDefault();
                lieuInput.value = item.dataset.full;
                suggestionsDiv.classList.remove('active');
            });
        });
    });

    lieuInput.addEventListener('keydown', (e) => {
        const items = suggestionsDiv.querySelectorAll('.autocomplete-item');
        if (!suggestionsDiv.classList.contains('active') || items.length === 0) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); selectedCommuneIndex = Math.min(selectedCommuneIndex + 1, items.length - 1); highlightItems(items); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); selectedCommuneIndex = Math.max(selectedCommuneIndex - 1, -1); highlightItems(items); }
        else if (e.key === 'Enter' && selectedCommuneIndex >= 0) { e.preventDefault(); lieuInput.value = items[selectedCommuneIndex].dataset.full; suggestionsDiv.classList.remove('active'); }
        else if (e.key === 'Escape') { suggestionsDiv.classList.remove('active'); }
    });

    function highlightItems(items) {
        items.forEach((item, i) => item.style.background = i === selectedCommuneIndex ? '#FFF3CD' : '');
    }

    document.addEventListener('click', (e) => {
        if (!lieuInput.contains(e.target) && !suggestionsDiv.contains(e.target)) {
            suggestionsDiv.classList.remove('active');
        }
    });

    // ============================================================
    // DROPDOWN TITRES (IDENTIQUE)
    // ============================================================
    function updateTitleDropdown() {
        const type = document.getElementById('eventType').value;
        const titles = type === 'Spectacle' ? SPECTACLES : EXPOSITIONS;
        const select = document.getElementById('eventTitle');
        select.innerHTML = '<option value="">-- Sélectionnez --</option>';
        titles.forEach(t => { const opt = document.createElement('option'); opt.value = t; opt.textContent = t; select.appendChild(opt); });
    }
    document.getElementById('eventType').addEventListener('change', updateTitleDropdown);

    function updateEditTitleDropdown(type) {
        const titles = type === 'Spectacle' ? SPECTACLES : EXPOSITIONS;
        const select = document.getElementById('editTitle');
        if (!select) return;
        select.innerHTML = '<option value="">-- Sélectionnez --</option>';
        titles.forEach(t => { const opt = document.createElement('option'); opt.value = t; opt.textContent = t; select.appendChild(opt); });
    }

    // ============================================================
    // CALENDRIER (IDENTIQUE)
    // ============================================================
    function renderCalendar() {
        const firstDay = new Date(currentYear, currentMonth, 1);
        let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const today = new Date();
        const isCurrentMonthYear = (today.getMonth() === currentMonth && today.getFullYear() === currentYear);

        let html = '';
        weekdays.forEach(d => { html += `<div class="weekday-header">${d}</div>`; });
        for (let i = 0; i < startOffset; i++) html += `<div class="cal-day other-month"></div>`;

        for (let d = 1; d <= daysInMonth; d++) {
            const isToday = isCurrentMonthYear && d === today.getDate();
            const events = getEventsForDate(currentYear, currentMonth, d);
            const hasEvent = events.length > 0;
            html += `<div class="cal-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}"
                         data-year="${currentYear}" data-month="${currentMonth}" data-day="${d}">${d}</div>`;
        }

        document.getElementById('calendarGrid').innerHTML = html;
        document.getElementById('monthName').textContent = `${monthNames[currentMonth]} ${currentYear}`;
        document.getElementById('yearSelect').value = currentYear;

        document.querySelectorAll('.cal-day[data-day]').forEach(dayDiv => {
            dayDiv.addEventListener('click', () => {
                openPopup(parseInt(dayDiv.dataset.year), parseInt(dayDiv.dataset.month), parseInt(dayDiv.dataset.day));
            });
        });
    }

    function populateYearSelect() {
        const select = document.getElementById('yearSelect');
        select.innerHTML = '';
        for (let y = 2026; y <= 2028; y++) {
            const opt = document.createElement('option');
            opt.value = y; opt.textContent = y;
            select.appendChild(opt);
        }
        select.value = currentYear;
        select.addEventListener('change', () => { currentYear = parseInt(select.value); renderCalendar(); });
    }

    function changeMonth(delta) {
        let m = currentMonth + delta;
        let y = currentYear;
        if (m < 0) { m = 11; y--; if (y < 2026) y = 2026; }
        else if (m > 11) { m = 0; y++; if (y > 2028) y = 2028; }
        currentMonth = m; currentYear = y;
        renderCalendar();
    }

    document.getElementById('prevMonthBtn').addEventListener('click', () => changeMonth(-1));
    document.getElementById('nextMonthBtn').addEventListener('click', () => changeMonth(1));

    // ============================================================
    // POPUP (AMÉLIORÉ AVEC SYNC SUPABASE)
    // ============================================================
    let currentPopupDate = null;
    let editingEventId = null;

    function openPopup(year, month, day) {
        currentPopupDate = { year, month, day };
        editingEventId = null;
        const key = `${year}-${month+1}-${day}`;
        const events = eventsData[key] || [];

        let html = `<h3>📅 ${formatDateFr(key)}</h3>`;

        if (events.length === 0) {
            html += `<p class="no-events-msg">Aucun événement ce jour.</p>`;
        } else {
            events.forEach(ev => {
                const typeIcon = ev.type === 'Exposition' ? '🖼️' : '🎭';
                html += `
                    <div class="popup-event-item">
                        <div class="popup-event-info">
                            <strong>${typeIcon} ${escapeHtml(ev.titre)}</strong><br>
                            📍 ${escapeHtml(ev.lieu) || '—'}
                            ${ev.period_id ? '<br><small style="color:#888;">🔗 Période</small>' : ''}
                        </div>
                        <div class="popup-actions">
                            <button class="btn-edit-popup" data-id="${ev.id}" data-type="${escapeHtml(ev.type)}" data-titre="${escapeHtml(ev.titre)}" data-lieu="${escapeHtml(ev.lieu || '')}">✏️</button>
                            <button class="btn-delete-popup" data-id="${ev.id}" data-period="${ev.period_id || ''}">🗑</button>
                        </div>
                    </div>`;
            });
        }

        html += `
            <div class="edit-form" id="editForm">
                <h4 style="color:var(--rose-spectacle);">✏️ Modifier l'événement</h4>
                <label>Type</label>
                <select id="editType"><option value="Spectacle">🎭 Spectacle</option><option value="Exposition">🖼️ Exposition</option></select>
                <label>Titre</label>
                <select id="editTitle"></select>
                <label>Lieu</label>
                <textarea id="editLieu" rows="2"></textarea>
                <div class="btn-row">
                    <button class="btn-save" id="saveEditBtn">💾 Sauvegarder</button>
                    <button class="btn-cancel" id="cancelEditBtn">Annuler</button>
                </div>
            </div>
            <button class="btn-close-popup" id="closePopupBtn">✖ Fermer</button>
        `;

        document.getElementById('popupContent').innerHTML = html;
        document.getElementById('eventsPopup').classList.add('active');

        document.getElementById('closePopupBtn').onclick = closePopup;
        document.getElementById('eventsPopup').onclick = (e) => {
            if (e.target === document.getElementById('eventsPopup')) closePopup();
        };

        // Supprimer
        document.querySelectorAll('.btn-delete-popup').forEach(btn => {
            btn.onclick = async () => {
                const id = btn.dataset.id;
                const periodId = btn.dataset.period;
                let msg = 'Supprimer cet événement ?';
                if (periodId && periodId !== 'undefined' && periodId !== '') {
                    msg = '⚠️ Supprimer TOUTE la période ?';
                }
                if (confirm(msg)) {
                    // Supprimer de Supabase
                    if (periodId && periodId !== 'undefined' && periodId !== '') {
                        await deletePeriodFromSupabase(periodId);
                        for (let k in eventsData) {
                            eventsData[k] = eventsData[k].filter(ev => ev.period_id !== periodId);
                            if (eventsData[k].length === 0) delete eventsData[k];
                        }
                    } else {
                        await deleteEventFromSupabase(id);
                        for (let k in eventsData) {
                            eventsData[k] = eventsData[k].filter(ev => ev.id !== id);
                            if (eventsData[k].length === 0) delete eventsData[k];
                        }
                    }
                    
                    // Sauvegarder en local
                    saveToLocalStorage();
                    renderCalendar();
                    
                    // Message de confirmation
                    if (!isOnline) {
                        alert('✅ Événement supprimé localement (synchronisation dès que la connexion sera rétablie)');
                    }
                    
                    openPopup(currentPopupDate.year, currentPopupDate.month, currentPopupDate.day);
                }
            };
        });

        // Éditer
        document.querySelectorAll('.btn-edit-popup').forEach(btn => {
            btn.onclick = () => {
                editingEventId = btn.dataset.id;
                document.getElementById('editType').value = btn.dataset.type;
                document.getElementById('editLieu').value = btn.dataset.lieu;
                updateEditTitleDropdown(btn.dataset.type);
                document.getElementById('editTitle').value = btn.dataset.titre;
                document.getElementById('editForm').classList.add('active');
                document.getElementById('editForm').scrollIntoView({ behavior: 'smooth' });
            };
        });

        document.getElementById('editType').addEventListener('change', function() {
            updateEditTitleDropdown(this.value);
        });

        document.getElementById('saveEditBtn').onclick = async () => {
            const newType = document.getElementById('editType').value;
            const newTitre = document.getElementById('editTitle').value;
            const newLieu = document.getElementById('editLieu').value.trim();
            if (!newTitre) { alert('Titre requis'); return; }
            
            // Mettre à jour localement
            for (let k in eventsData) {
                eventsData[k].forEach(ev => {
                    if (ev.id === editingEventId) {
                        ev.type = newType;
                        ev.titre = newTitre;
                        ev.lieu = newLieu;
                    }
                });
            }
            
            // Mettre à jour Supabase
            const updated = await updateEventInSupabase(editingEventId, {
                type: newType,
                titre: newTitre,
                lieu: newLieu
            });
            
            saveToLocalStorage();
            renderCalendar();
            
            if (!updated && !isOnline) {
                alert('✅ Modifications sauvegardées localement');
            }
            
            openPopup(currentPopupDate.year, currentPopupDate.month, currentPopupDate.day);
        };

        document.getElementById('cancelEditBtn').onclick = () => {
            document.getElementById('editForm').classList.remove('active');
            editingEventId = null;
        };
    }

    function closePopup() {
        document.getElementById('eventsPopup').classList.remove('active');
        currentPopupDate = null;
        editingEventId = null;
    }

    // ============================================================
    // SOUMISSION (AMÉLIORÉE AVEC BATCH SUPABASE)
    // ============================================================
    document.getElementById('eventForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = '⏳...';

        const type = document.getElementById('eventType').value;
        const titre = document.getElementById('eventTitle').value;
        if (!titre) { alert('Titre requis'); btn.disabled = false; btn.textContent = '💾 Enregistrer'; return; }
        const lieu = document.getElementById('eventLieu').value.trim();

        let dateKeys = [];
        if (currentMode === 'single') {
            const val = document.getElementById('eventDate').value;
            if (!val) { alert('Date requise'); btn.disabled = false; btn.textContent = '💾 Enregistrer'; return; }
            const [y,m,d] = val.split('-');
            dateKeys.push(`${y}-${parseInt(m)}-${parseInt(d)}`);
            document.getElementById('eventDate').value = '';
        } else {
            const start = document.getElementById('periodStart').value;
            const end = document.getElementById('periodEnd').value;
            if (!start || !end) { alert('Dates début et fin requises'); btn.disabled = false; btn.textContent = '💾 Enregistrer'; return; }
            if (start > end) { alert('Date début > date fin'); btn.disabled = false; btn.textContent = '💾 Enregistrer'; return; }
            const dates = getDatesInRange(start, end);
            if (dates.length === 0) { alert('Aucune date dans la plage'); btn.disabled = false; btn.textContent = '💾 Enregistrer'; return; }
            dateKeys = dates.map(d => dateToKey(d));
            document.getElementById('periodStart').value = ''; document.getElementById('periodEnd').value = '';
            document.getElementById('periodSummary').classList.remove('visible');
        }

        const periodId = (currentMode === 'period') ? 'period_' + Date.now() : null;
        const newEvents = [];
        
        dateKeys.forEach(dk => {
            const ev = {
                id: 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2,5),
                event_date: dk,
                type,
                titre,
                lieu,
                period_id: periodId
            };
            newEvents.push(ev);
            if (!eventsData[dk]) eventsData[dk] = [];
            eventsData[dk].push(ev);
        });

        // Sauvegarder dans Supabase (batch)
        let savedCount = 0;
        if (supabase && isOnline) {
            for (const ev of newEvents) {
                const success = await saveEventToSupabase(ev);
                if (success) savedCount++;
            }
        }
        
        // Toujours sauvegarder en local
        saveToLocalStorage();
        document.getElementById('eventLieu').value = '';
        renderCalendar();
        
        if (!isOnline) {
            alert(`✅ ${dateKeys.length} événement(s) sauvegardé(s) localement\n📡 Synchronisation automatique dès la reconnexion`);
        } else {
            alert(`✅ ${dateKeys.length} événement(s) ajouté(s) !\n☁️ ${savedCount} synchronisé(s) avec Supabase`);
        }
        
        btn.disabled = false; btn.textContent = '💾 Enregistrer';
    });

    // ============================================================
    // TOUT EFFACER (AMÉLIORÉ)
    // ============================================================
    document.getElementById('clearAllBtn').addEventListener('click', async () => {
        if (confirm('⚠️ ATTENTION : Supprimer TOUS les événements ?\nCette action est irréversible !')) {
            // Double confirmation
            if (confirm('Êtes-vous VRAIMENT sûr ?')) {
                let supabaseCleared = false;
                
                // Supprimer de Supabase
                if (supabase && isOnline) {
                    const { error } = await supabase
                        .from(TABLE_NAME)
                        .delete()
                        .neq('id', 0); // Supprime tout
                    if (!error) supabaseCleared = true;
                }
                
                // Supprimer du localStorage
                localStorage.removeItem('recremagic_calendar');
                eventsData = {};
                renderCalendar();
                
                if (!isOnline) {
                    alert('✅ Tous les événements locaux ont été supprimés\n⚠️ Pensez à synchroniser avec Supabase');
                } else if (supabaseCleared) {
                    alert('✅ Tous les événements ont été supprimés de Supabase et du stockage local');
                }
            }
        }
    });

    // ============================================================
    // SYNCHRONISATION (NOUVEAU)
    // ============================================================
    async function syncWithSupabase() {
        if (!supabase || !isOnline) return;
        
        try {
            // Récupérer les données Supabase
            const { data, error } = await supabase
                .from(TABLE_NAME)
                .select('*');
            
            if (error) throw error;
            
            // Fusionner avec les données locales
            const localData = loadFromLocalStorage(true);
            const mergedData = { ...localData };
            
            if (data) {
                data.forEach(ev => {
                    if (!mergedData[ev.event_date]) {
                        mergedData[ev.event_date] = [];
                    }
                    // Éviter les doublons
                    const exists = mergedData[ev.event_date].some(e => e.id === ev.id);
                    if (!exists) {
                        mergedData[ev.event_date].push(ev);
                    }
                });
            }
            
            eventsData = mergedData;
            saveToLocalStorage();
            renderCalendar();
            console.log('✅ Synchronisation réussie');
        } catch (e) {
            console.error('❌ Erreur synchronisation :', e);
        }
    }

    // ============================================================
    // INIT (CORRIGÉ)
    // ============================================================
    populateYearSelect();
    updateTitleDropdown();
    renderCalendar();
    loadCommunes();
    
    // Initialiser Supabase et synchroniser
    initSupabase().then(() => {
        console.log('✅ Admin calendrier prêt !');
        console.log('📡 Mode :', isOnline ? 'Supabase' : 'Local');
    });

    // Synchronisation périodique
    setInterval(async () => {
        await syncWithSupabase();
    }, 30000); // Toutes les 30 secondes
</script>
</body>
