<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin calendrier - Récré Magic (Supabase Fix)</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --vert-caravane: #7CB69F;
            --rose-spectacle: #EC407A;
            --jaune-accent: #FFB300;
            --text-dark: #2C1810;
            --couleur-ducoup1: #FF8A65;
            --couleur-ducoup2: #FFAB91;
            --couleur-roulettes: #FFCC80;
            --couleur-maboul: #4CAF50;
            --couleur-expo1: #81D4FA;
            --couleur-expo2: #B39DDB;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--vert-caravane); border-radius: 10px; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-image: url('images/fond-image.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: 0;
            pointer-events: none;
        }

        .admin-wrapper {
            position: relative;
            z-index: 10;
            max-width: 1050px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: rgba(235,215,185,0.96);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 1.8rem;
            border: 5px solid #7a5c3e;
            outline: 4px solid #5a3e2a;
            outline-offset: 4px;
            box-shadow: 0 0 0 8px #3e2a1a, 0 15px 30px rgba(0,0,0,0.3);
        }

        .admin-header {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .admin-header h1 {
            font-family: 'MedievalSharp', cursive;
            color: #f5d06b;
            font-size: 2rem;
            text-shadow: 2px 2px 0 #3e6b3a;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            border: none;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .btn-primary { background: var(--vert-caravane); color: white; }
        .btn-primary:hover { background: #5a8f78; }
        .btn-danger { background: #D32F2F; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        input, textarea, select {
            width: 100%;
            padding: 0.7rem;
            margin: 0.5rem 0;
            border-radius: 30px;
            border: 1.5px solid #c4a882;
            font-family: inherit;
            background: #fefefe;
            font-size: 0.9rem;
        }
        textarea { border-radius: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .mode-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .mode-tab {
            flex: 1;
            padding: 0.5rem;
            border-radius: 30px;
            background: #ddd;
            color: #555;
            border: 2px solid transparent;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .mode-tab.active {
            background: var(--jaune-accent);
            color: #2C1810;
            border-color: #e6a000;
        }

        /* Calendrier */
        .calendar-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }
        .month-year-nav {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.4rem;
            text-align: center;
        }
        .weekday-header { font-weight: bold; color: var(--rose-spectacle); padding: 0.6rem 0; font-size: 0.8rem; }
        .cal-day {
            padding: 0.6rem 0;
            border-radius: 20px;
            cursor: pointer;
            background: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-weight: 500;
        }
        .cal-day.other-month { opacity: 0.3; pointer-events: none; }

        /* Couleurs par spectacle */
        .cal-day.spectacle-ducoup1 { background: var(--couleur-ducoup1) !important; color: #4E2000; font-weight: bold; }
        .cal-day.spectacle-ducoup2 { background: var(--couleur-ducoup2) !important; color: #4E2000; font-weight: bold; }
        .cal-day.spectacle-roulettes { background: var(--couleur-roulettes) !important; color: #4E2000; font-weight: bold; }
        .cal-day.spectacle-expo1 { background: var(--couleur-expo1) !important; color: #003049; font-weight: bold; }
        .cal-day.spectacle-expo2 { background: var(--couleur-expo2) !important; color: #1A0033; font-weight: bold; }
        
        /* Maboul : fond normal + contour vert */
        .cal-day.spectacle-maboul {
            box-shadow: inset 0 0 0 3px var(--couleur-maboul) !important;
            font-weight: bold;
        }
        /* Si Maboul est le seul événement, fond blanc avec contour vert */
        .cal-day.spectacle-maboul-only {
            background: rgba(255,255,255,0.9) !important;
            box-shadow: inset 0 0 0 3px var(--couleur-maboul) !important;
            font-weight: bold;
            color: #2C5F3F;
        }

        .cal-day.today {
            box-shadow: inset 0 0 0 2px var(--rose-spectacle);
            font-weight: bold;
        }
        
        /* Aujourd'hui + Maboul */
        .cal-day.today.spectacle-maboul {
            box-shadow: inset 0 0 0 3px var(--rose-spectacle), inset 0 0 0 5px var(--couleur-maboul) !important;
        }

        /* Calendrier de sélection */
        .selection-calendar .cal-day {
            cursor: pointer;
        }
        .selection-calendar .cal-day.selected {
            background: var(--vert-caravane) !important;
            color: white !important;
            font-weight: bold;
            transform: scale(1.05);
            box-shadow: none !important;
        }
        .selection-calendar .cal-day.in-range {
            background: #b8dfca !important;
            color: #2C5F3F;
            font-weight: bold;
            box-shadow: none !important;
        }
        .selection-calendar .cal-day.range-start,
        .selection-calendar .cal-day.range-end {
            background: var(--vert-caravane) !important;
            color: white !important;
            font-weight: bold;
            box-shadow: none !important;
        }

        .selected-dates-info {
            background: #f0f8f2;
            padding: 10px 15px;
            border-radius: 15px;
            margin: 1rem 0;
            font-size: 0.9rem;
            display: none;
            border-left: 4px solid var(--vert-caravane);
        }
        .selected-dates-info.active { display: block; }
        .hidden { display: none !important; }

        /* Légende */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
            font-size: 0.8rem;
            align-items: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.5rem;
            background: rgba(255,255,255,0.5);
            border-radius: 12px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        .legend-outline {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            border: 3px solid var(--couleur-maboul);
            background: white;
        }

        /* Popup */
        .events-popup {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .events-popup.active { display: flex; }
        .popup-content {
            background: white; border-radius: 25px; padding: 1.5rem;
            width: 95%; max-width: 500px; border: 4px solid var(--vert-caravane);
        }
        .popup-event-item {
            background: #f9f9f9; padding: 0.8rem; margin-bottom: 0.6rem;
            border-left: 4px solid var(--vert-caravane);
            display: flex; justify-content: space-between; align-items: center;
        }
        .edit-form { display: none; margin-top: 1rem; border-top: 1px solid #eee; padding-top: 1rem; }
        .edit-form.active { display: block; }
    </style>
</head>
<body>

<div class="admin-wrapper">
    <div class="card admin-header">
        <h1>🎪 Admin Calendrier</h1>
    </div>

    <!-- Carte 1 : Calendrier de visualisation -->
    <div class="card">
        <h2 style="color:var(--text-dark); margin-bottom:1rem;">📅 Calendrier des événements</h2>
        <div class="calendar-header-row">
            <div class="month-year-nav">
                <button class="btn btn-primary" id="prevMonthBtn">←</button>
                <span id="monthName" style="font-weight:bold; font-size:1.2rem; min-width:150px; text-align:center;"></span>
                <button class="btn btn-primary" id="nextMonthBtn">→</button>
            </div>
            <select id="yearSelect" style="width:auto; margin:0;"></select>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="legend">
            <span style="font-weight:bold;">Légende :</span>
            <div class="legend-item"><div class="legend-color" style="background:var(--couleur-ducoup1);"></div> DU COUP ON VIENT</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--couleur-ducoup2);"></div> DU COUP revient</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--couleur-roulettes);"></div> ROULETTES</div>
            <div class="legend-item"><div class="legend-outline"></div> MABOUL</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--couleur-expo1);"></div> FÉERIE</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--couleur-expo2);"></div> GÉANTS</div>
        </div>
    </div>

    <!-- Carte 2 : Ajout d'événement avec calendrier de sélection -->
    <div class="card">
        <h2 style="color:var(--text-dark); margin-bottom:1rem;">➕ Ajouter un événement</h2>
        <div class="mode-tabs">
            <div class="mode-tab active" id="modeSingle">📅 Date unique</div>
            <div class="mode-tab" id="modePeriod">📆 Période</div>
        </div>

        <!-- Calendrier de sélection -->
        <div class="selection-calendar">
            <div class="calendar-header-row">
                <div class="month-year-nav">
                    <button class="btn btn-primary" id="selPrevMonthBtn">←</button>
                    <span id="selMonthName" style="font-weight:bold; font-size:1rem; min-width:130px; text-align:center;"></span>
                    <button class="btn btn-primary" id="selNextMonthBtn">→</button>
                </div>
                <select id="selYearSelect" style="width:auto; margin:0;"></select>
            </div>
            <div class="calendar-grid" id="selectionCalendarGrid"></div>
        </div>

        <div class="selected-dates-info" id="selectedDatesInfo">
            🗓 <strong>Dates sélectionnées :</strong> <span id="selectedDatesText"></span>
            <button class="btn btn-danger" id="clearSelectionBtn" style="margin-left:10px; padding:0.3rem 0.8rem; font-size:0.8rem;">✕</button>
        </div>

        <form id="eventForm">
            <div class="form-row">
                <div>
                    <label>Type</label>
                    <select id="eventType">
                        <option value="Spectacle">🎭 Spectacle</option>
                        <option value="Exposition">🖼️ Exposition</option>
                    </select>
                </div>
                <div>
                    <label>Titre</label>
                    <select id="eventTitle" required>
                        <option value="">-- Sélectionnez --</option>
                    </select>
                </div>
            </div>

            <label>Lieu</label>
            <textarea id="eventLieu" rows="2" placeholder="Commune et code postal..."></textarea>

            <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; margin-top:0.5rem;">💾 Enregistrer</button>
        </form>
    </div>
</div>

<div class="events-popup" id="eventsPopup">
    <div class="popup-content" id="popupContent"></div>
</div>

<script>
    // --- CONFIG SUPABASE ---
    const SUPABASE_URL = 'https://ilpnwxuecooxthnoxyws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscG53eHVlY29veHRobm94eXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTYxNTcsImV4cCI6MjA5MzI5MjE1N30.0iwBXWrLCNcqdfVjAlp8f_F0q6yHQYfLj_SAvLCt9jY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentMode = 'single';
    
    // Calendrier principal
    let currentMonth, currentYear;
    
    // Calendrier de sélection
    let selMonth, selYear;
    
    let eventsData = {}; 
    let editingEventId = null;
    let selectedDates = new Set();
    let selectionAnchor = null;

    const SPECTACLES = ["DU COUP ON VIENT CHEZ VOUS","DU COUP on revient chez vous","COMME SUR DES ROULETTES","DÉLICIEUSEMENT MABOUL"];
    const EXPOSITIONS = ["LA FÉERIE DES MARIONNETTES","LES GÉANTS DU CARNAVAL"];
    const monthNames = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

    // Mapping titre -> classe CSS
    function getSpectacleClass(titre) {
        switch(titre) {
            case "DU COUP ON VIENT CHEZ VOUS": return 'spectacle-ducoup1';
            case "DU COUP on revient chez vous": return 'spectacle-ducoup2';
            case "COMME SUR DES ROULETTES": return 'spectacle-roulettes';
            case "DÉLICIEUSEMENT MABOUL": return 'spectacle-maboul';
            case "LA FÉERIE DES MARIONNETTES": return 'spectacle-expo1';
            case "LES GÉANTS DU CARNAVAL": return 'spectacle-expo2';
            default: return '';
        }
    }

    // Détermine les classes pour une date dans le calendrier principal
    function getEventClasses(dateKey) {
        const events = eventsData[dateKey] || [];
        if (events.length === 0) return { classes: [], hasMaboul: false, hasOther: false };
        
        let hasMaboul = false;
        let hasOther = false;
        let classes = [];
        
        events.forEach(ev => {
            if (ev.titre === "DÉLICIEUSEMENT MABOUL") {
                hasMaboul = true;
            } else {
                hasOther = true;
                const cls = getSpectacleClass(ev.titre);
                if (cls && !classes.includes(cls)) classes.push(cls);
            }
        });
        
        // Si Maboul est le seul événement
        if (hasMaboul && !hasOther) {
            classes.push('spectacle-maboul-only');
        } else if (hasMaboul && hasOther) {
            classes.push('spectacle-maboul');
        }
        
        return { classes, hasMaboul, hasOther };
    }

    const now = new Date();
    currentMonth = now.getMonth();
    currentYear = now.getFullYear();
    selMonth = now.getMonth();
    selYear = now.getFullYear();

    async function fetchEvents() {
        const { data, error } = await _supabase.from('events').select('*');
        if (error) return console.error(error);
        eventsData = {};
        data.forEach(ev => {
            if (!eventsData[ev.event_date]) eventsData[ev.event_date] = [];
            eventsData[ev.event_date].push(ev);
        });
        renderMainCalendar();
        renderSelectionCalendar();
    }

    // Vérifie si un spectacle du groupe "DU COUP" existe déjà à cette date
    function hasDuCoupOnDate(dateKey, excludePeriodId = null) {
        const events = eventsData[dateKey] || [];
        return events.some(ev => {
            if (excludePeriodId && ev.period_id === excludePeriodId) return false;
            return ev.titre === "DU COUP ON VIENT CHEZ VOUS" || 
                   ev.titre === "DU COUP on revient chez vous" || 
                   ev.titre === "COMME SUR DES ROULETTES";
        });
    }

    // Vérifie si DÉLICIEUSEMENT MABOUL existe déjà à cette date
    function hasMaboulOnDate(dateKey, excludePeriodId = null) {
        const events = eventsData[dateKey] || [];
        return events.some(ev => {
            if (excludePeriodId && ev.period_id === excludePeriodId) return false;
            return ev.titre === "DÉLICIEUSEMENT MABOUL";
        });
    }

    // --- CALENDRIER PRINCIPAL (visualisation) ---
    function renderMainCalendar() {
        const firstDay = new Date(currentYear, currentMonth, 1);
        let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const todayStr = dateToKey(new Date());

        let html = '';
        ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].forEach(d => html += `<div class="weekday-header">${d}</div>`);
        for (let i = 0; i < startOffset; i++) html += `<div class="cal-day other-month"></div>`;

        for (let d = 1; d <= daysInMonth; d++) {
            const key = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const { classes } = getEventClasses(key);
            
            let allClasses = ['cal-day'];
            if (key === todayStr) allClasses.push('today');
            allClasses = allClasses.concat(classes);
            
            html += `<div class="${allClasses.join(' ')}" 
                         onclick="openPopup('${key}')">${d}</div>`;
        }
        document.getElementById('calendarGrid').innerHTML = html;
        document.getElementById('monthName').textContent = `${monthNames[currentMonth]} ${currentYear}`;
    }

    // --- CALENDRIER DE SÉLECTION (affiche aussi les événements existants) ---
    function renderSelectionCalendar() {
        const firstDay = new Date(selYear, selMonth, 1);
        let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const daysInMonth = new Date(selYear, selMonth + 1, 0).getDate();
        const todayStr = dateToKey(new Date());

        let html = '';
        ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].forEach(d => html += `<div class="weekday-header">${d}</div>`);
        for (let i = 0; i < startOffset; i++) html += `<div class="cal-day other-month"></div>`;

        // Déterminer la plage sélectionnée pour le mode période
        let rangeStart = null, rangeEnd = null;
        if (currentMode === 'period' && selectedDates.size >= 2) {
            const sorted = Array.from(selectedDates).sort();
            rangeStart = sorted[0];
            rangeEnd = sorted[sorted.length - 1];
        }

        for (let d = 1; d <= daysInMonth; d++) {
            const key = `${selYear}-${String(selMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isSelected = selectedDates.has(key);
            const isToday = key === todayStr;
            const { classes: eventClasses } = getEventClasses(key);
            
            let classes = ['cal-day'];
            if (isToday) classes.push('today');
            
            // Ajouter les classes d'événements existants (sauf si la date est dans la sélection)
            if (!isSelected) {
                classes = classes.concat(eventClasses);
            }
            
            // Classes de sélection
            if (currentMode === 'single') {
                if (isSelected) classes.push('selected');
            } else {
                if (isSelected && key === rangeStart && rangeEnd && key === rangeEnd) {
                    classes.push('selected');
                } else if (isSelected && key === rangeStart) {
                    classes.push('range-start');
                } else if (isSelected && rangeEnd && key === rangeEnd) {
                    classes.push('range-end');
                } else if (isSelected) {
                    classes.push('in-range');
                }
            }
            
            html += `<div class="${classes.join(' ')}" 
                         onclick="handleSelectionClick(event, '${key}')">${d}</div>`;
        }
        document.getElementById('selectionCalendarGrid').innerHTML = html;
        document.getElementById('selMonthName').textContent = `${monthNames[selMonth]} ${selYear}`;
        updateSelectedDatesInfo();
    }

    function handleSelectionClick(event, dateKey) {
        if (currentMode === 'single') {
            selectedDates = new Set([dateKey]);
            selectionAnchor = null;
        } else {
            if (selectionAnchor === null) {
                selectionAnchor = dateKey;
                selectedDates = new Set([dateKey]);
            } else {
                const allDates = getDatesBetween(selectionAnchor, dateKey);
                selectedDates = new Set(allDates);
                selectionAnchor = null;
            }
        }
        renderSelectionCalendar();
    }

    function getDatesBetween(startKey, endKey) {
        const start = new Date(startKey + 'T00:00:00');
        const end = new Date(endKey + 'T00:00:00');
        const dates = [];
        const current = new Date(Math.min(start, end));
        const last = new Date(Math.max(start, end));
        
        while (current <= last) {
            dates.push(dateToKey(current));
            current.setDate(current.getDate() + 1);
        }
        return dates;
    }

    function updateSelectedDatesInfo() {
        const info = document.getElementById('selectedDatesInfo');
        const text = document.getElementById('selectedDatesText');
        const sorted = Array.from(selectedDates).sort();
        
        if (sorted.length === 0) {
            info.classList.remove('active');
            return;
        }
        
        info.classList.add('active');
        if (sorted.length === 1) {
            text.textContent = `1 date : ${formatDate(sorted[0])}`;
        } else {
            text.textContent = `${sorted.length} dates : du ${formatDate(sorted[0])} au ${formatDate(sorted[sorted.length-1])}`;
        }
        
        document.getElementById('submitBtn').textContent = `💾 Enregistrer (${sorted.length} date(s))`;
    }

    function formatDate(key) {
        const [y, m, d] = key.split('-');
        return `${d}/${m}/${y}`;
    }

    function dateToKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    // --- SOUMISSION AVEC VÉRIFICATION DES CONFLITS ---
    document.getElementById('eventForm').onsubmit = async (e) => {
        e.preventDefault();
        
        if (selectedDates.size === 0) {
            alert('⚠️ Veuillez sélectionner au moins une date dans le calendrier de sélection.');
            return;
        }
        
        const type = document.getElementById('eventType').value;
        const titre = document.getElementById('eventTitle').value;
        const lieu = document.getElementById('eventLieu').value.trim();
        
        if (!titre) {
            alert('⚠️ Veuillez sélectionner un titre.');
            return;
        }
        
        const sortedDates = Array.from(selectedDates).sort();
        const isDuCoup = ["DU COUP ON VIENT CHEZ VOUS", "DU COUP on revient chez vous", "COMME SUR DES ROULETTES"].includes(titre);
        const isMaboul = titre === "DÉLICIEUSEMENT MABOUL";
        
        for (const dateKey of sortedDates) {
            if (isDuCoup && hasDuCoupOnDate(dateKey)) {
                alert(`⚠️ Un spectacle "DU COUP" existe déjà le ${formatDate(dateKey)}. Impossible d'en mettre deux le même jour.`);
                return;
            }
            if (isMaboul && hasMaboulOnDate(dateKey)) {
                alert(`⚠️ "DÉLICIEUSEMENT MABOUL" est déjà présent le ${formatDate(dateKey)}.`);
                return;
            }
        }
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = '⏳ Enregistrement...';
        
        const periodId = sortedDates.length > 1 ? 'p_' + Date.now() : null;
        
        const toInsert = sortedDates.map(dateKey => ({ 
            id: crypto.randomUUID(), 
            event_date: dateKey, 
            type, 
            titre, 
            lieu,
            period_id: periodId
        }));

        const { error } = await _supabase.from('events').insert(toInsert);
        if (error) alert("Erreur : " + error.message);
        else {
            alert(`✅ ${toInsert.length} événement(s) ajouté(s) !`);
            document.getElementById('eventForm').reset();
            selectedDates = new Set();
            selectionAnchor = null;
            updateTitleDropdown();
            await fetchEvents();
        }
        btn.disabled = false;
        btn.textContent = '💾 Enregistrer';
    };

    async function openPopup(dateKey) {
        const events = eventsData[dateKey] || [];
        let html = `<h3 style="margin-bottom:10px;">📅 ${formatDate(dateKey)}</h3>`;
        if (events.length === 0) html += `<p>Aucun événement.</p>`;
        else {
            events.forEach(ev => {
                let borderColor = '#7CB69F';
                if (ev.titre === "DÉLICIEUSEMENT MABOUL") borderColor = '#4CAF50';
                if (ev.titre === "DU COUP ON VIENT CHEZ VOUS") borderColor = '#FF8A65';
                if (ev.titre === "DU COUP on revient chez vous") borderColor = '#FFAB91';
                if (ev.titre === "COMME SUR DES ROULETTES") borderColor = '#FFCC80';
                
                html += `
                <div class="popup-event-item" style="border-left-color: ${borderColor};">
                    <div><strong>${ev.titre}</strong><br><small>${ev.lieu || ''}</small></div>
                    <div style="display:flex; gap:5px;">
                        <button class="btn btn-primary" onclick="prepareEdit('${ev.id}', '${ev.type}', '${ev.titre.replace(/'/g, "\\'")}', '${(ev.lieu || '').replace(/'/g, "\\'")}')">✏️</button>
                        <button class="btn btn-danger" onclick="deleteEvent('${ev.id}', '${ev.period_id || ''}')">🗑</button>
                    </div>
                </div>`;
            });
        }
        html += `
        <div class="edit-form" id="editForm">
            <select id="editType" onchange="updateEditTitleDropdown(this.value)"><option value="Spectacle">🎭 Spectacle</option><option value="Exposition">🖼️ Exposition</option></select>
            <select id="editTitle"></select>
            <textarea id="editLieu" rows="2"></textarea>
            <button class="btn btn-primary" onclick="saveEdit()" style="width:100%; margin-top:5px;">Sauvegarder</button>
        </div>
        <button class="btn" onclick="closePopup()" style="width:100%; margin-top:10px; background:#ccc;">Fermer</button>`;
        document.getElementById('popupContent').innerHTML = html;
        document.getElementById('eventsPopup').classList.add('active');
    }

    window.prepareEdit = (id, type, titre, lieu) => {
        editingEventId = id;
        document.getElementById('editType').value = type;
        updateEditTitleDropdown(type);
        setTimeout(() => {
            document.getElementById('editTitle').value = titre;
            document.getElementById('editLieu').value = lieu;
        }, 50);
        document.getElementById('editForm').classList.add('active');
    };

    window.saveEdit = async () => {
        const updates = {
            type: document.getElementById('editType').value,
            titre: document.getElementById('editTitle').value,
            lieu: document.getElementById('editLieu').value
        };
        await _supabase.from('events').update(updates).eq('id', editingEventId);
        closePopup();
        await fetchEvents();
    };

    window.deleteEvent = async (id, periodId) => {
        if (!confirm('Supprimer ?')) return;
        let q = _supabase.from('events').delete();
        if (periodId && periodId !== 'null' && periodId !== 'undefined' && periodId !== '') {
            q = q.eq('period_id', periodId);
        } else {
            q = q.eq('id', id);
        }
        await q;
        closePopup();
        await fetchEvents();
    }

    function updateTitleDropdown() {
        const t = document.getElementById('eventType').value;
        const list = t === 'Spectacle' ? SPECTACLES : EXPOSITIONS;
        document.getElementById('eventTitle').innerHTML = '<option value="">-- Sélectionnez --</option>' + list.map(x => `<option value="${x}">${x}</option>`).join('');
    }

    window.updateEditTitleDropdown = (type) => {
        const list = type === 'Spectacle' ? SPECTACLES : EXPOSITIONS;
        document.getElementById('editTitle').innerHTML = list.map(x => `<option value="${x}">${x}</option>`).join('');
    };

    function switchMode(m) {
        currentMode = m;
        document.getElementById('modeSingle').classList.toggle('active', m === 'single');
        document.getElementById('modePeriod').classList.toggle('active', m === 'period');
        selectedDates = new Set();
        selectionAnchor = null;
        renderSelectionCalendar();
    }

    function closePopup() { document.getElementById('eventsPopup').classList.remove('active'); }

    // Init
    document.getElementById('modeSingle').onclick = () => switchMode('single');
    document.getElementById('modePeriod').onclick = () => switchMode('period');
    document.getElementById('eventType').onchange = updateTitleDropdown;
    
    // Navigation calendrier principal
    document.getElementById('prevMonthBtn').onclick = () => { currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;} renderMainCalendar(); };
    document.getElementById('nextMonthBtn').onclick = () => { currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;} renderMainCalendar(); };
    
    // Navigation calendrier de sélection
    document.getElementById('selPrevMonthBtn').onclick = () => { selMonth--; if(selMonth<0){selMonth=11;selYear--;} renderSelectionCalendar(); };
    document.getElementById('selNextMonthBtn').onclick = () => { selMonth++; if(selMonth>11){selMonth=0;selYear++;} renderSelectionCalendar(); };
    
    document.getElementById('clearSelectionBtn').onclick = () => {
        selectedDates = new Set();
        selectionAnchor = null;
        renderSelectionCalendar();
    };

    (async () => {
        // Années calendrier principal
        const ySel = document.getElementById('yearSelect');
        for(let y=2024; y<=2030; y++) ySel.innerHTML += `<option value="${y}">${y}</option>`;
        ySel.value = currentYear;
        ySel.onchange = (e) => { currentYear = parseInt(e.target.value); renderMainCalendar(); };
        
        // Années calendrier sélection
        const sySel = document.getElementById('selYearSelect');
        for(let y=2024; y<=2030; y++) sySel.innerHTML += `<option value="${y}">${y}</option>`;
        sySel.value = selYear;
        sySel.onchange = (e) => { selYear = parseInt(e.target.value); renderSelectionCalendar(); };
        
        updateTitleDropdown();
        await fetchEvents();
    })();
</script>
</body>
</html>
