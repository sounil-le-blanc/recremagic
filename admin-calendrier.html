<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin calendrier - Récré Magic</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --vert-caravane: #7CB69F;
            --rose-spectacle: #EC407A;
            --jaune-accent: #FFB300;
            --text-dark: #2C1810;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f4f1ea;
            background-image: url('images/fond-image.jpg');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .admin-wrapper { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; position: relative; z-index: 1; }

        .card {
            background: rgba(235, 215, 185, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 1.5rem;
            border: 4px solid #7a5c3e;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 { font-family: 'MedievalSharp', cursive; color: #5a3e2a; text-align: center; margin-bottom: 0.5rem; }
        label { display: block; margin-top: 0.8rem; font-weight: bold; color: var(--text-dark); }

        input, textarea, select {
            width: 100%; padding: 0.7rem; margin-top: 0.3rem;
            border-radius: 20px; border: 1px solid #c4a882; font-family: inherit;
        }

        .btn {
            padding: 0.8rem 1.5rem; border-radius: 30px; border: none;
            cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 1rem;
        }
        .btn-primary { background: var(--vert-caravane); color: white; width: 100%; }
        .btn-primary:hover { background: #5a8f78; }

        .mode-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .mode-tab {
            flex: 1; padding: 0.6rem; border-radius: 20px;
            background: #ddd; text-align: center; cursor: pointer; font-weight: bold;
        }
        .mode-tab.active { background: var(--jaune-accent); color: var(--text-dark); }

        /* Calendrier */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .weekday { font-weight: bold; color: var(--rose-spectacle); padding: 5px; font-size: 0.8rem; text-align: center; }
        .cal-day {
            background: rgba(255,255,255,0.6); aspect-ratio: 1/1; display: flex;
            align-items: center; justify-content: center; border-radius: 10px;
            cursor: pointer; font-weight: 500; transition: 0.2s;
        }
        .cal-day:hover { background: var(--jaune-accent); }
        .cal-day.has-event { background: #FFE082; border: 2px solid var(--jaune-accent); font-weight: bold; }
        .cal-day.today { background: var(--rose-spectacle) !important; color: white; }
        .cal-day.other-month { opacity: 0.2; pointer-events: none; }

        /* Popup */
        .popup {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center;
        }
        .popup.active { display: flex; }
        .popup-content { background: white; padding: 2rem; border-radius: 20px; width: 90%; max-width: 400px; }
        .event-item { background: #f0f0f0; padding: 10px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; }
        
        .hidden { display: none; }
        .suggestions { background: white; border: 1px solid #ccc; position: absolute; width: 100%; z-index: 10; border-radius: 10px; max-height: 150px; overflow-y: auto; }
        .suggestion-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; }
        .suggestion-item:hover { background: #fff3cd; }
    </style>
</head>
<body>

<div class="admin-wrapper">
    <div class="card">
        <h1>🎪 Administration</h1>
        <div class="mode-tabs">
            <div class="mode-tab active" id="tabSingle">Date unique</div>
            <div class="mode-tab" id="tabPeriod">Période</div>
        </div>

        <form id="eventForm">
            <div id="singleFields">
                <label>Date</label>
                <input type="date" id="eventDate">
            </div>
            <div id="periodFields" class="hidden">
                <label>Du</label><input type="date" id="dateStart">
                <label>Au</label><input type="date" id="dateEnd">
            </div>

            <label>Type</label>
            <select id="eventType">
                <option value="Spectacle">🎭 Spectacle</option>
                <option value="Exposition">🖼️ Exposition</option>
            </select>

            <label>Titre</label>
            <select id="eventTitle" required></select>

            <label>Lieu</label>
            <div style="position:relative;">
                <input type="text" id="eventLieu" placeholder="Cherchez une ville...">
                <div id="lieuSuggestions" class="suggestions hidden"></div>
            </div>

            <button type="submit" class="btn btn-primary" id="btnSave">💾 Enregistrer l'événement</button>
        </form>
    </div>

    <div class="card">
        <div class="calendar-header">
            <button class="btn" style="margin:0; padding:5px 15px;" onclick="changeMonth(-1)">←</button>
            <h3 id="monthDisplay"></h3>
            <button class="btn" style="margin:0; padding:5px 15px;" onclick="changeMonth(1)">→</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
</div>

<div id="popup" class="popup">
    <div class="popup-content" id="popupInner"></div>
</div>

<script>
    const SUPABASE_URL = 'https://ilpnwxuecooxthnoxyws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscG53eHVlY29veHRobm94eXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTYxNTcsImV4cCI6MjA5MzI5MjE1N30.0iwBXWrLCNcqdfVjAlp8f_F0q6yHQYfLj_SAvLCt9jY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    let eventsData = {};
    let communes = [];

    const SPECTACLES = ["DU COUP ON VIENT CHEZ VOUS","DU COUP on revient chez vous","COMME SUR DES ROULETTES","DÉLICIEUSEMENT MABOUL"];
    const EXPOSITIONS = ["LA FÉERIE DES MARIONNETTES","LES GÉANTS DU CARNAVAL"];

    // 1. Initialisation des titres
    function updateTitles() {
        const type = document.getElementById('eventType').value;
        const list = type === 'Spectacle' ? SPECTACLES : EXPOSITIONS;
        const select = document.getElementById('eventTitle');
        select.innerHTML = list.map(t => `<option value="${t}">${t}</option>`).join('');
    }
    document.getElementById('eventType').onchange = updateTitles;

    // 2. Gestion des onglets
    document.getElementById('tabSingle').onclick = () => {
        document.getElementById('tabSingle').classList.add('active');
        document.getElementById('tabPeriod').classList.remove('active');
        document.getElementById('singleFields').classList.remove('hidden');
        document.getElementById('periodFields').classList.add('hidden');
    };
    document.getElementById('tabPeriod').onclick = () => {
        document.getElementById('tabPeriod').classList.add('active');
        document.getElementById('tabSingle').classList.remove('active');
        document.getElementById('periodFields').classList.remove('hidden');
        document.getElementById('singleFields').classList.add('hidden');
    };

    // 3. Calendrier
    async function fetchEvents() {
        const { data, error } = await supabase.from('events').select('*');
        if (data) {
            eventsData = {};
            data.forEach(ev => {
                if(!eventsData[ev.event_date]) eventsData[ev.event_date] = [];
                eventsData[ev.event_date].push(ev);
            });
            renderCalendar();
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const monthDisplay = document.getElementById('monthDisplay');
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const offset = firstDay === 0 ? 6 : firstDay - 1;
        const today = new Date().toISOString().split('T')[0];

        monthDisplay.textContent = new Intl.DateTimeFormat('fr-FR', {month:'long', year:'numeric'}).format(new Date(currentYear, currentMonth));
        
        let html = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(d => `<div class="weekday">${d}</div>`).join('');
        for(let i=0; i<offset; i++) html += `<div class="cal-day other-month"></div>`;

        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isToday = dateStr === today ? 'today' : '';
            const hasEvent = eventsData[dateStr] ? 'has-event' : '';
            html += `<div class="cal-day ${isToday} ${hasEvent}" onclick="openPopup('${dateStr}')">${d}</div>`;
        }
        grid.innerHTML = html;
    }

    function changeMonth(n) {
        currentMonth += n;
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar();
    }

    // 4. Popup et suppression
    function openPopup(date) {
        const evs = eventsData[date] || [];
        let html = `<h3>${date}</h3><br>`;
        evs.forEach(ev => {
            html += `<div class="event-item">
                <span><b>${ev.titre}</b><br>${ev.lieu}</span>
                <button onclick="deleteEvent('${ev.id}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
            </div>`;
        });
        html += `<button class="btn" onclick="closePopup()">Fermer</button>`;
        document.getElementById('popupInner').innerHTML = html;
        document.getElementById('popup').classList.add('active');
    }

    function closePopup() { document.getElementById('popup').classList.remove('active'); }

    async function deleteEvent(id) {
        if(confirm("Supprimer cet événement ?")) {
            await supabase.from('events').delete().eq('id', id);
            fetchEvents();
            closePopup();
        }
    }

    // 5. Enregistrement
    document.getElementById('eventForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSave');
        btn.disabled = true;

        const type = document.getElementById('eventType').value;
        const titre = document.getElementById('eventTitle').value;
        const lieu = document.getElementById('eventLieu').value;
        let dates = [];

        if (document.getElementById('tabSingle').classList.contains('active')) {
            dates.push(document.getElementById('eventDate').value);
        } else {
            let start = new Date(document.getElementById('dateStart').value);
            let end = new Date(document.getElementById('dateEnd').value);
            while(start <= end) {
                dates.push(start.toISOString().split('T')[0]);
                start.setDate(start.getDate() + 1);
            }
        }

        const payload = dates.map(d => ({ event_date: d, type, titre, lieu }));
        const { error } = await supabase.from('events').insert(payload);
        
        if (error) alert("Erreur : " + error.message);
        else {
            alert("Enregistré avec succès !");
            fetchEvents();
        }
        btn.disabled = false;
    };

    // 6. Communes (Autocomplete simplifié)
    async function initCommunes() {
        const res = await fetch('https://raw.githubusercontent.com/kevin-robert/communes-francaises/main/communes.json');
        communes = await res.json();
    }
    document.getElementById('eventLieu').oninput = function() {
        const val = this.value.toLowerCase();
        const suggs = document.getElementById('lieuSuggestions');
        if(val.length < 2) { suggs.classList.add('hidden'); return; }
        const matches = communes.filter(c => c.nom.toLowerCase().startsWith(val)).slice(0, 5);
        suggs.innerHTML = matches.map(c => `<div class="suggestion-item" onclick="setLieu('${c.nom} (${c.code_postal})')">${c.nom} (${c.code_postal})</div>`).join('');
        suggs.classList.remove('hidden');
    };
    window.setLieu = (val) => {
        document.getElementById('eventLieu').value = val;
        document.getElementById('lieuSuggestions').classList.add('hidden');
    };

    // INIT
    updateTitles();
    renderCalendar();
    fetchEvents();
    initCommunes();
</script>
</body>
</html>
