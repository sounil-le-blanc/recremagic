<script>
/* Ouverture mise en scène. Fond peint généré (poupif-paysage.webp) sous la carte Excalidraw (essai-carte.excalidraw, export SVG inline sans son fond bleu) ; mêmes deux décors générés
   que l'essai précédent ; ici la caméra est dirigée par une petite partition (pauses, saluts, surprise).
   Aucun SDK de conversation, micro, voix ou appel réseau. */
(function(){
'use strict';
const theatre=document.getElementById('theatre'),monde=document.getElementById('monde'),atelier=document.getElementById('atelier');
const repere=document.getElementById('repere'),leg=document.getElementById('legende'),lueur=document.getElementById('lueur'),rejouerBtn=document.getElementById('rejouer');
const petite=document.getElementById('petite');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PLAN_W=4328,PLAN_H=1772,PH={x:3064,y:354,w:1200,h:750},PORTE={x:4011,y:900},CHEMIN=[[450,1470],[1000,1430],[1800,1480],[2500,1480],[3200,1440],[3600,1370],[3800,1250],[3900,1100]];
const IW=750*16/9,IX=PH.x-(IW-PH.w)/2,ST={x:IX+0.540*IW,y:PH.y+0.43*750,w:0.125*IW,h:0.14*750};
lueur.style.cssText+=`left:${ST.x-ST.w*0.3}px;top:${ST.y-ST.h*0.3}px;width:${ST.w*1.6}px;height:${ST.h*1.6}px`;
function cadres(){
 const w=theatre.clientWidth,h=theatre.clientHeight;
 const zc=Math.max(w/PLAN_W,h/PLAN_H);
 const zm=Math.max(w/1500,h/900);
 const zp=Math.max(w/300,h/400),zd=Math.max(w/PH.w,h/PH.h),zs=Math.max(w/ST.w,h/ST.h);
 return{carte:{z:zc,cx:PLAN_W/2,cy:PLAN_H/2},depart:{z:zm,cx:CHEMIN[0][0],cy:CHEMIN[0][1]},
  porte:{z:zp,cx:PORTE.x,cy:PORTE.y},decor:{z:zd,cx:PH.x+PH.w/2,cy:PH.y+PH.h/2},scene:{z:zs,cx:ST.x+ST.w/2,cy:ST.y+ST.h/2},zm};
}
/* point du chemin à la fraction u (0..1) de sa longueur */
const LONG=[0];for(let i=1;i<CHEMIN.length;i++)LONG.push(LONG[i-1]+Math.hypot(CHEMIN[i][0]-CHEMIN[i-1][0],CHEMIN[i][1]-CHEMIN[i-1][1]));
function surChemin(u){const d=u*LONG[LONG.length-1];let i=1;while(i<CHEMIN.length-1&&LONG[i]<d)i++;const t=(d-LONG[i-1])/(LONG[i]-LONG[i-1]);
 return{x:CHEMIN[i-1][0]+(CHEMIN[i][0]-CHEMIN[i-1][0])*t,y:CHEMIN[i-1][1]+(CHEMIN[i][1]-CHEMIN[i-1][1])*t};}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const soft=t=>t*t*(3-2*t);
function interp(a,b,s){return{z:Math.exp(Math.log(a.z)+(Math.log(b.z)-Math.log(a.z))*s),cx:a.cx+(b.cx-a.cx)*s,cy:a.cy+(b.cy-a.cy)*s};}
/* p : -2 carte entière, -1 à gauche, 0 devant la roulotte, 1 atelier, 2 petite scène. */
function cadreAt(p){
 const k=cadres();let c;const w=theatre.clientWidth,h=theatre.clientHeight;
 const borne=c=>{const hv=w/(2*c.z),vv=h/(2*c.z);return{z:c.z,cx:Math.min(Math.max(c.cx,hv),PLAN_W-hv),cy:Math.min(Math.max(c.cy,vv),PLAN_H-vv)};};
 const fin=CHEMIN[CHEMIN.length-1],devant=borne({z:k.zm,cx:fin[0],cy:fin[1]});
 if(p<-1)c=interp(k.carte,borne(k.depart),soft(p+2));
 else if(p<0){const pt=surChemin(soft(p+1));c=borne({z:k.zm*(1+0.12*Math.sin((p+1)*Math.PI)),cx:pt.x,cy:pt.y});}
 else if(p<=1)c=p<0.55?interp(devant,k.porte,ease(p/0.55)):interp(k.porte,k.decor,ease((p-0.55)/0.45));
 else c=interp(k.decor,k.scene,ease(p-1));
 return{z:c.z,x:w/2-c.cx*c.z,y:h/2-c.cy*c.z};
}
function opAtelier(p){return p<=0.48?0:p>=0.74?1:(p-0.48)/0.26;}
function opPetite(p){return p<=1.4?0:p>=1.8?1:(p-1.4)/0.4;}
let pActu=-2,run=0,debut=0,fin=0;
function rendre(p){const c=cadreAt(p);monde.style.transform=`translate(${c.x}px,${c.y}px) scale(${c.z})`;atelier.style.opacity=opAtelier(p);petite.style.opacity=opPetite(p);}
new ResizeObserver(()=>rendre(pActu)).observe(theatre);rendre(-2);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function marcher(){debut=performance.now();fin=Infinity;}
function reposer(){fin=performance.now();}
function dire(t){leg.classList.remove('on');return sleep(t?450:0).then(()=>{if(t){leg.textContent=t;leg.classList.add('on');}});}
function anim(from,to,D,id){return new Promise(res=>{
 if(reduced){pActu=to;rendre(to);return res();}
 monde.style.willChange='transform';const t0=performance.now();
 (function b(t){if(id!==run)return res();const u=Math.min(1,(t-t0)/D);pActu=from+(to-from)*u;rendre(pActu);
  if(u<1)requestAnimationFrame(b);else{requestAnimationFrame(()=>{monde.style.willChange='auto';});res();}})(t0);});}
const images=[...document.images].concat([]);
const pret=Promise.all(images.map(i=>i.decode?i.decode().catch(()=>{}):0));
async function jouer(){
 const id=++run;const ok=()=>id===run;
 rejouerBtn.hidden=true;lueur.classList.remove('on');petite.classList.remove('allume');leg.classList.remove('on');
 document.body.dataset.scene='entree';pActu=-2;rendre(-2);repere.textContent='Ouverture';reposer();
 await pret;await sleep(500);if(!ok())return;
 if(reduced){pActu=2;rendre(2);document.body.dataset.scene='caravane';lueur.classList.add('on');petite.classList.add('allume');await dire('Le château s\'allume. Monsieur Poupif vous attend.');rejouerBtn.hidden=false;return;}
 document.body.dataset.scene='carte';marcher();
 dire('Voici Récrémagic, la nuit.');
 await anim(-2,-1,2800,id);if(!ok())return;
 dire('Poupif connaît le chemin.');
 await anim(-1,0,6200,id);if(!ok())return;
 reposer();await dire('Là. La petite roulotte, lumière allumée.');await sleep(2600);if(!ok())return;
 await dire('Il frappe. Personne ne répond… il entre.');await sleep(1400);if(!ok())return;
 document.body.dataset.scene='caravane';marcher();repere.textContent='Dans la roulotte';
 await anim(0,1,4600,id);if(!ok())return;
 reposer();repere.textContent="L'atelier";await dire('Plus grand dedans que dehors.');await sleep(3200);if(!ok())return;
 await dire('Au fond, une toute petite scène.');await sleep(1700);if(!ok())return;
 marcher();await anim(1,2,4200,id);if(!ok())return;
 reposer();repere.textContent='La petite scène';await sleep(900);if(!ok())return;
 lueur.classList.add('on');petite.classList.add('allume');await dire('Chut… le château s\'allume.');await sleep(3600);if(!ok())return;
 await dire('Monsieur Poupif vous attend.');await sleep(2600);if(!ok())return;
 rejouerBtn.hidden=false;
}
rejouerBtn.addEventListener('click',jouer);
const canvas=document.getElementById('poupif'),ctx=canvas.getContext('2d'),marche=new Image(),salut=new Image();
marche.src='images/poupif-visite/poupif-marche.webp';salut.src='images/poupif-visite/poupif-salut-face.webp';
debut=performance.now();fin=performance.now();let dernier=-1,dernierePlanche='';
function dessin(t){
 const bouge=t<fin&&!reduced;const img=bouge?marche:salut;
 let n=bouge?Math.floor((t-debut)/1000*24)%24:(reduced?0:Math.min(95,Math.floor(Math.max(0,t-fin)/1000*12)));
 const cols=bouge?6:10,ident=bouge?'marche':'salut';
 if(img.complete&&img.naturalWidth&&(n!==dernier||ident!==dernierePlanche)){
  ctx.clearRect(0,0,240,431);ctx.save();if(bouge){ctx.translate(240,0);ctx.scale(-1,1);}ctx.drawImage(img,(n%cols)*240,Math.floor(n/cols)*431,240,431,0,0,240,431);ctx.restore();dernier=n;dernierePlanche=ident;
 }
 requestAnimationFrame(dessin);
}
requestAnimationFrame(dessin);

document.getElementById('paysage').addEventListener('error',()=>document.getElementById('erreur').hidden=false);
const dbg=parseFloat(new URLSearchParams(location.search).get('t'));
if(!isNaN(dbg)){run++;pActu=Math.min(2,Math.max(-2,dbg));rendre(pActu);document.body.dataset.scene=pActu<=0?'carte':'caravane';if(pActu>=2)lueur.classList.add('on');fin=performance.now();}
else jouer();
})();
</script>
</body></html>
