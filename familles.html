<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récré Magic - Familles & Fans</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Récré Magic">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @media (min-width: 1024px) {
            body { zoom: 150%; }
            body::before { zoom: 0.6667; }
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            position: relative;
        }

        body {
            background-image: url('images/fond-image.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #EC407A, #7CB69F); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(135deg, #7CB69F, #EC407A); }

        /* ========== NAVBAR ========== */
        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            height: 55px;
        }
        .navbar-container {
            width: 100%;
            height: 100%;
            padding: 0 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
        }
        .nav-left-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-shrink: 0;
            z-index: 2;
        }
        .logo-wrapper {
            text-decoration: none;
            transition: all 0.25s ease;
            line-height: 0;
        }
        .logo-wrapper img {
            height: 120px;
            transition: transform 0.25s;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
            margin-top: 60px;
        }
        .logo-wrapper:hover img {
            transform: scale(1.08);
            filter: drop-shadow(0 6px 18px rgba(0,0,0,0.9));
        }
        .back-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1.1rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        .back-arrow:hover {
            background: rgba(255,255,255,0.2);
            border-color: #FFB300;
            color: #FFB300;
            box-shadow: 0 0 12px rgba(255,179,0,0.3);
        }

        /* ========== AVATAR & MENU UTILISATEUR ========== */
        .user-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #7CB69F, #5a8f78);
            border-radius: 50%;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            transition: all 0.2s;
            border: 2px solid rgba(255,255,255,0.5);
            cursor: pointer;
        }
        .user-avatar.premium {
            background: linear-gradient(135deg, #FFB300, #e6a200);
            border: 2px solid #FFD700;
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        .user-avatar:hover {
            transform: scale(1.05);
        }
        .user-menu {
            position: relative;
            display: inline-block;
        }
        .user-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 0.5rem 0;
            min-width: 180px;
            z-index: 1001;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .user-dropdown a, .user-dropdown button {
            display: block;
            width: 100%;
            padding: 0.6rem 1rem;
            color: white !important;
            text-decoration: none !important;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Quicksand', sans-serif;
        }
        .user-dropdown a:hover, .user-dropdown button:hover {
            background: rgba(255,255,255,0.1);
            color: white !important;
            text-decoration: none !important;
        }
        .user-menu:hover .user-dropdown {
            display: block;
        }

        .nav-icons {
            display: flex;
            gap: 1.2rem;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: nowrap;
            z-index: 2;
        }
        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.1rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-icon-img {
            height: 32px;
            width: auto;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
            transition: transform 0.2s;
        }
        .icon-wrapper:hover .nav-icon-img {
            transform: scale(1.15);
        }
        .icon-wrapper .icon-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.7);
            transition: color 0.2s;
            white-space: nowrap;
        }
        .icon-wrapper:hover .icon-label { color: #FFB300; }

        .desktop-view, .mobile-view, .instruction {
            position: relative;
            z-index: 2;
        }

        /* ========== DESKTOP VERSION ========== */
        .desktop-view { display: block; }

        .caravane-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .caravane-container {
            position: relative;
            width: 90%;
            max-width: 1800px;
            margin: 0 auto;
        }

        .caravane-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            transition: opacity 0.05s ease;
            border: 8px solid #5C3A1E;
            outline: 4px solid #3E2A1A;
            outline-offset: 2px;
        }

        .hotspots-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hotspot {
            cursor: pointer;
            pointer-events: all;
            fill: transparent;
        }

        .instruction {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #2C1810;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
            z-index: 1000;
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        /* ========== MOBILE VERSION ========== */
        .mobile-view { display: none; }

        .mobile-caravane-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-x: scroll;
            overflow-y: hidden;
            background: rgba(0, 0, 0, 0.3);
            -webkit-overflow-scrolling: touch;
        }

        .mobile-caravane-container {
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 50vw;
        }

        .mobile-caravane-container::after {
            content: '';
            display: block;
            width: 80vw;
            height: 1px;
            flex-shrink: 0;
        }

        .mobile-caravane-image {
            height: 60vh;
            width: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            border: 8px solid #5C3A1E;
            outline: 4px solid #3E2A1A;
            outline-offset: 2px;
        }

        /* ========== CORRECTIONS MOBILE ========== */
        @media (max-width: 968px) {
            .desktop-view { display: none; }
            .mobile-view { display: block; }
            .instruction { display: none; }
        }

        @media (max-width: 600px) {
            .navbar { height: 48px; }
            .navbar-container { padding: 0 0.8rem; }
            .nav-left-group { gap: 0.4rem; }
            .logo-wrapper img { height: 70px !important; margin-top: 35px; }
            .back-arrow { width: 32px; height: 32px; font-size: 1rem; }
            
            .nav-icon-img { height: 28px !important; }
            .icon-label { font-size: 0.55rem !important; letter-spacing: 0.3px; }
            .nav-icons { gap: 0.8rem; }
            
            .user-avatar { width: 36px; height: 36px; font-size: 0.9rem; }
            .user-dropdown { top: 40px; min-width: 160px; }
            .user-dropdown a, .user-dropdown button { padding: 0.5rem 0.8rem; font-size: 0.8rem; }
            
            .caravane-image {
                border-width: 5px;
                outline-width: 3px;
                outline-offset: 1px;
            }
            .mobile-caravane-image {
                border-width: 5px;
                outline-width: 3px;
                outline-offset: 1px;
            }
        }

        @media (max-width: 450px) {
            .icon-label { font-size: 0.5rem !important; }
            .nav-icon-img { height: 26px !important; }
            .nav-icons { gap: 0.6rem; }
            .navbar-container { padding: 0 0.5rem; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <div class="nav-left-group">
            <a href="index.html" class="logo-wrapper">
                <img src="images/logo.webp" alt="Récré Magic">
            </a>
            <div class="back-arrow" onclick="history.back()" title="Retour">←</div>
        </div>

        <div class="nav-icons">
            <a href="calendrier.html" class="icon-wrapper">
                <img src="images/icone-calendrier.webp" alt="Calendrier" class="nav-icon-img">
                <span class="icon-label">Calendrier</span>
            </a>
            <a href="boutique.html" class="icon-wrapper">
                <img src="images/icone-boutique.webp" alt="Boutique" class="nav-icon-img">
                <span class="icon-label">Boutique</span>
            </a>
            <!-- Lien Abonnement -->
            <a href="Abonnement.html" class="icon-wrapper" id="abonnement-link">
                <img src="images/icone-abonnement.webp" alt="Abonnement" class="nav-icon-img">
                <span class="icon-label">Abonnement</span>
            </a>
            <!-- Bouton Connexion (visible quand non connecté) -->
            <a href="connexion.html" class="icon-wrapper" id="connexion-btn">
                <img src="images/icone-connexion.webp" alt="Connexion" class="nav-icon-img">
                <span class="icon-label">Connexion</span>
            </a>
            <!-- Avatar utilisateur (caché par défaut) -->
            <div class="user-menu" id="user-menu" style="display: none;">
                <div class="user-avatar" id="user-avatar">?</div>
                <div class="user-dropdown">
                    <a href="profil.html">👤 Mon profil</a>
                    <button id="logout-btn-nav">🚪 Déconnexion</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- ========== DESKTOP VERSION ========== -->
<div class="desktop-view">
    <div class="instruction">✨ Survolez les personnages pour les découvrir !</div>

    <div class="caravane-wrapper">
        <div class="caravane-container">
            <img src="images/caravane-base.webp"
                 alt="Caravane Récré Magic"
                 class="caravane-image"
                 id="caravaneImg">

            <svg class="hotspots-svg" viewBox="0 0 2000 660" preserveAspectRatio="xMidYMid meet">

                <a href="https://www.youtube.com/@recremagic"
                   target="_blank"
                   onmouseover="changeImage('caravane-toto.webp')"
                   onmouseout="changeImage('caravane-base.webp')">
                    <rect x="250" y="140" width="180" height="380" class="hotspot" />
                </a>

                <a href="nos-stars.html"
                   onmouseover="changeImage('caravane-rideau.webp')"
                   onmouseout="changeImage('caravane-base.webp')">
                    <rect x="535" y="275" width="410" height="200" class="hotspot" />
                </a>

                <a href="nos-stars.html"
                   onmouseover="changeImage('caravane-flo.webp')"
                   onmouseout="changeImage('caravane-base.webp')">
                    <rect x="1000" y="180" width="200" height="400" class="hotspot" />
                </a>

                <a href="boutique.html"
                   onmouseover="changeImage('caravane-rideau-or.webp')"
                   onmouseout="changeImage('caravane-base.webp')">
                    <rect x="1240" y="140" width="190" height="400" class="hotspot" />
                </a>

                <a href="calendrier.html"
                   onmouseover="changeImage('caravane-calendrier.webp')"
                   onmouseout="changeImage('caravane-base.webp')">
                    <rect x="1610" y="210" width="120" height="100" class="hotspot" />
                </a>

                <a href="nos-stars.html"
                   onmouseover="changeImage('caravane-baptiste.webp')"
                   onmouseout="changeImage('caravane-base.webp')">
                    <rect x="1600" y="360" width="150" height="220" class="hotspot" />
                </a>

                <a href="nos-stars.html"
                   onmouseover="changeImage('caravane-gus.webp')"
                   onmouseout="changeImage('caravane-base.webp')">
                    <rect x="1800" y="260" width="200" height="420" class="hotspot" />
                </a>

                <a href="nos-stars.html"
                   onmouseover="changeImage('caravane-cookie.webp')"
                   onmouseout="changeImage('caravane-base.webp')">
                    <rect x="515" y="480" width="100" height="100" class="hotspot" />
                </a>

            </svg>
        </div>
    </div>
</div>

<!-- ========== MOBILE VERSION ========== -->
<div class="mobile-view">
    <div class="mobile-caravane-wrapper" id="mobileWrapper">
        <div class="mobile-caravane-container">
            <img src="images/caravane-base.webp"
                 alt="Caravane Récré Magic"
                 class="mobile-caravane-image"
                 id="mobileCaravaneImg">
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ilpnwxuecooxthnoxyws.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscG53eHVlY29veHRobm94eXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTYxNTcsImV4cCI6MjA5MzI5MjE1N30.0iwBXWrLCNcqdfVjAlp8f_F0q6yHQYfLj_SAvLCt9jY';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ========== AVATAR & MENU UTILISATEUR ==========
    let dropdownTimeout;

    async function updateNavbarAvatar() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const userMenu = document.getElementById('user-menu');
        const connexionBtn = document.getElementById('connexion-btn');
        const abonnementLink = document.getElementById('abonnement-link');
        const userAvatar = document.getElementById('user-avatar');
        const dropdown = document.querySelector('.user-dropdown');
        
        if (user) {
            if (connexionBtn) connexionBtn.style.display = 'none';
            if (userMenu) userMenu.style.display = 'block';
            
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('subscription_status')
                .eq('id', user.id)
                .single();
            
            const isPremium = profile?.subscription_status === 'active';
            const avatarLetter = user.email?.charAt(0).toUpperCase() || '?';
            
            if (userAvatar) {
                userAvatar.textContent = avatarLetter;
                if (isPremium) {
                    userAvatar.classList.add('premium');
                    if (abonnementLink) abonnementLink.style.display = 'none';
                } else {
                    userAvatar.classList.remove('premium');
                    if (abonnementLink) abonnementLink.style.display = 'flex';
                }
            }
            
            const logoutBtn = document.getElementById('logout-btn-nav');
            if (logoutBtn) {
                const newLogoutBtn = logoutBtn.cloneNode(true);
                logoutBtn.parentNode.replaceChild(newLogoutBtn, logoutBtn);
                newLogoutBtn.addEventListener('click', async () => {
                    await supabaseClient.auth.signOut();
                    window.location.reload();
                });
            }
        } else {
            if (userMenu) userMenu.style.display = 'none';
            if (connexionBtn) connexionBtn.style.display = 'flex';
            if (abonnementLink) abonnementLink.style.display = 'flex';
        }
    }

    // ========== FONCTIONS CARAVANE ==========
    function changeImage(imageName) {
        const img = document.getElementById('caravaneImg');
        if (img) img.src = 'images/' + imageName;
    }

    window.addEventListener('load', () => {
        updateNavbarAvatar();
        
        const imagesToPreload = [
            'caravane-base.webp', 'caravane-toto.webp', 'caravane-rideau.webp',
            'caravane-flo.webp', 'caravane-rideau-or.webp', 'caravane-calendrier.webp',
            'caravane-baptiste.webp', 'caravane-gus.webp', 'caravane-cookie.webp'
        ];
        imagesToPreload.forEach(src => { const img = new Image(); img.src = 'images/' + src; });
    });

    // Mobile scroll zones
    if (window.innerWidth <= 968) {
        const wrapper = document.getElementById('mobileWrapper');
        const img = document.getElementById('mobileCaravaneImg');

        if (wrapper && img) {
            const zones = [
                { name: 'toto', start: 12.5, end: 21.5, image: 'caravane-toto.webp', link: 'https://www.youtube.com/@recremagic', external: true },
                { name: 'cookie', start: 23, end: 29, image: 'caravane-cookie.webp', link: 'nos-stars.html', external: false },
                { name: 'rideau', start: 26.75, end: 47.25, image: 'caravane-rideau.webp', link: 'nos-stars.html', external: false },
                { name: 'flo', start: 50, end: 60, image: 'caravane-flo.webp', link: 'nos-stars.html', external: false },
                { name: 'rideau-or', start: 62, end: 71.5, image: 'caravane-rideau-or.webp', link: 'boutique.html', external: false },
                { name: 'calendrier', start: 78, end: 83, image: 'caravane-calendrier.webp', link: 'calendrier.html', external: false },
                { name: 'baptiste', start: 84, end: 90, image: 'caravane-baptiste.webp', link: 'nos-stars.html', external: false },
                { name: 'gus', start: 91, end: 100, image: 'caravane-gus.webp', link: 'nos-stars.html', external: false }
            ];

            let currentZone = null;
            let currentZoneData = null;

            function checkZone() {
                const imgRect = img.getBoundingClientRect();
                const imgWidth = imgRect.width;
                const screenCenter = window.innerWidth / 2;
                const centerOnImage = screenCenter - imgRect.left;
                const centerPercent = (centerOnImage / imgWidth) * 100;
                let foundZone = null;
                for (let zone of zones) {
                    if (centerPercent >= zone.start && centerPercent <= zone.end) {
                        foundZone = zone;
                        break;
                    }
                }
                if (foundZone && foundZone.name !== currentZone) {
                    currentZone = foundZone.name;
                    currentZoneData = foundZone;
                    img.src = 'images/' + foundZone.image;
                } else if (!foundZone && currentZone !== null) {
                    currentZone = null;
                    currentZoneData = null;
                    img.src = 'images/caravane-base.webp';
                }
            }

            img.addEventListener('click', () => {
                if (currentZoneData) {
                    if (currentZoneData.external) window.open(currentZoneData.link, '_blank');
                    else window.location.href = currentZoneData.link;
                }
            });

            let scrollTimeout;
            wrapper.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(checkZone, 50);
            });
            setTimeout(checkZone, 200);
        }
    }

    supabaseClient.auth.onAuthStateChange(() => {
        updateNavbarAvatar();
    });
</script>
</body>
</html>
